name: Capture Live Endpoint Schemas

# Manual-dispatch ONLY. Regenerates tests/fixtures/live-responses/*.json by
# hitting the live Defender XDR portal with auth material from repository
# secrets. Useful when:
#   - tenant adds/removes features and endpoint responses change shape
#   - a new stream is promoted from deferred -> active
#   - operators want to verify schemas offline pre-deployment
#
# Does NOT run on push/PR — `workflow_dispatch` is itself the opt-in gate.
# Operators must explicitly click "Run workflow" in the Actions UI. No
# accidental capture is possible from a misconfigured branch.

on:
  # Architecture E (Plan R++++++++++): nightly schema-drift detection + on-demand
  # manual dispatch + on-manifest-change PR trigger. Runs OpenAPI fixture
  # generator unconditionally (no live creds required for OpenAPI fallback).
  schedule:
    # 03:30 UTC nightly — catches portal-side schema drift; generates openapi-
    # derived stubs for any new candidate streams added to manifest.
    - cron: '30 3 * * *'

  pull_request:
    paths:
      - 'src/Modules/Xdr.Defender.Client/endpoints.manifest.psd1'
      - 'tools/Capture-EndpointSchemas.ps1'
      - 'tools/Generate-FixtureFromOpenApi.ps1'
      - '.github/workflows/capture-schemas.yml'

  workflow_dispatch:
    inputs:
      stream_filter:
        description: 'Wildcard for which streams to capture (default: *)'
        required: false
        default: '*'
      include_deferred:
        description: 'Attempt deferred streams too (expected 4xx/5xx)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      skip_live_capture:
        description: 'Skip live capture (only run OpenAPI fixture generation — useful when SP creds rotate)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  capture:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - name: Write .env.local from secrets
        shell: pwsh
        env:
          CAPTURE_UPN:          ${{ secrets.CAPTURE_UPN }}
          CAPTURE_AUTH_METHOD:  ${{ secrets.CAPTURE_AUTH_METHOD }}
          CAPTURE_PASSWORD:     ${{ secrets.CAPTURE_PASSWORD }}
          CAPTURE_TOTP_SECRET:  ${{ secrets.CAPTURE_TOTP_SECRET }}
          CAPTURE_SCCAUTH:      ${{ secrets.CAPTURE_SCCAUTH }}
          CAPTURE_XSRF_TOKEN:   ${{ secrets.CAPTURE_XSRF_TOKEN }}
        run: |
          if (-not $env:CAPTURE_UPN) {
              throw "Required secret CAPTURE_UPN is not configured on this repository."
          }
          $envFile = "tests/.env.local"
          @"
          XDRLR_TEST_UPN=$env:CAPTURE_UPN
          XDRLR_TEST_AUTH_METHOD=$env:CAPTURE_AUTH_METHOD
          XDRLR_TEST_PASSWORD=$env:CAPTURE_PASSWORD
          XDRLR_TEST_TOTP_SECRET=$env:CAPTURE_TOTP_SECRET
          XDRLR_TEST_SCCAUTH=$env:CAPTURE_SCCAUTH
          XDRLR_TEST_XSRF_TOKEN=$env:CAPTURE_XSRF_TOKEN
          "@ | Out-File -FilePath $envFile -Encoding utf8

      - name: Run capture (skip on cron / PR / when no creds / when skip_live_capture set)
        # Live capture requires SP creds (CAPTURE_* secrets). Cron + PR runs may
        # not have valid creds (lab tenant; rotation). Architecture E unconditionally
        # runs the OpenAPI fixture generator step below — that step doesn't need
        # live creds. So if live capture skipped, we still produce schema fixtures.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_live_capture != 'true' && env.CAPTURE_UPN != '' }}
        env:
          CAPTURE_UPN: ${{ secrets.CAPTURE_UPN }}
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ inputs.include_deferred }}' -eq 'true') { $extra += '-IncludeDeferred' }
          $streamFilter = '${{ inputs.stream_filter }}'
          if (-not $streamFilter) { $streamFilter = '*' }
          pwsh -NoProfile -File ./tools/Capture-EndpointSchemas.ps1 -StreamFilter $streamFilter @extra
          if ($LASTEXITCODE -ne 0) { throw "Capture failed (exit $LASTEXITCODE)" }

      - name: Generate openapi-derived fixtures for streams without live capture
        # Plan R++++++++.1 P4 wiring (2026-05-08): for any manifest stream that
        # didn't get a live -raw.json (license-gated 4xx, transient capture
        # failure, or new stream awaiting first capture), generate a stub from
        # the corresponding nodoc OpenAPI spec so ProjectionMap dry-run tests
        # can validate parser logic without live data.
        shell: pwsh
        run: |
          if (Test-Path './.internal/nodoc-reference/specifications/nodoc-defender-xdr/specification') {
              pwsh -NoProfile -File ./tools/Generate-FixtureFromOpenApi.ps1
              if ($LASTEXITCODE -ne 0) { Write-Warning "OpenAPI fixture generator returned non-zero exit; continuing (non-blocking)" }
          } else {
              Write-Host "Skipping openapi-derived fixture generation: nodoc spec dir not present in repo (gitignored)."
          }

      - name: Verify no PII leaks
        shell: pwsh
        run: |
          $leaks = Get-ChildItem tests/fixtures/live-responses/*.json -File | ForEach-Object {
              $c = Get-Content $_.FullName -Raw
              $m = [regex]::Match($c, '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\b')
              if ($m.Success -and $m.Value -ne '00000000-0000-0000-0000-000000000000') {
                  [pscustomobject]@{ File = $_.Name; Leak = $m.Value }
              }
          }
          if ($leaks) {
              $leaks | Format-Table -AutoSize
              throw "PII leak detected — aborting."
          }
          Write-Host "PII audit clean."

      - name: Open PR with refreshed fixtures
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $branch = "capture-schemas-$(Get-Date -Format yyyyMMdd-HHmmss)"
          git checkout -b $branch
          git add tests/fixtures/live-responses
          if (-not (git diff --cached --quiet)) {
              git commit -m "chore(fixtures): refresh live schema fixtures"
              git push --set-upstream origin $branch
              gh pr create --title "Refresh live schema fixtures" --body "Automated capture. Review for PII before merge." --base main
          } else {
              Write-Host "No changes to commit."
          }
