name: Dependabot auto-merge

# Auto-merges Dependabot PRs that bump patch / minor versions after all
# required CI checks pass. Major version bumps are NEVER auto-merged
# (Dependabot labels them; we skip explicitly) — those require manual review.
#
# This pairs with repo-level setting `allow_auto_merge=true` (set via
# `gh api -X PATCH repos/<owner>/<repo> -F allow_auto_merge=true`) and
# branch-protection required status checks (gitleaks, PSScriptAnalyzer,
# Unit tests (ubuntu-latest), Static validate, Summary).
#
# Flow: Dependabot opens PR -> CI runs -> if green AND non-major bump,
# this workflow runs `gh pr merge --auto --squash`, which sets up the
# auto-merge intent on the PR. As soon as required checks all pass,
# GitHub squash-merges with the PR title as commit message.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve update metadata
        id: meta
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7  # v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch + minor
        if: ${{ steps.meta.outputs.update-type != 'version-update:semver-major' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Comment when major bump skipped
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-major' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "Auto-merge SKIPPED: this is a **major** version bump. Manual review required (Dependabot v2 semver-major)."
