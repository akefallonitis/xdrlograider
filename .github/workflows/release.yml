name: release

# Cosign keyless signing notes:
#   - The `id-token: write` permission below grants the workflow access to
#     GitHub Actions' BUILT-IN OIDC token endpoint.
#   - That OIDC token is used INTERNALLY by sigstore.dev / Fulcio to issue a
#     short-lived signing cert. Operators do NOT configure ANYTHING.
#   - This is the same signing approach the pilot at xdrlograider/ uses since
#     v0.1.0 GA — no setup steps in any Azure tenant, no Entra federated
#     credentials, no Service Principal, no Key Vault.
#   - "Azure OIDC for deployment" (which DOES require Entra federated cred
#     setup) is a DIFFERENT pattern that this repo deliberately does NOT use.

on:
  push:
    tags: [ 'v*' ]
  # Auto-refresh v0.1.0 release whenever ci.yml passes on main. This is
  # the "fix-as-we-go" path: a fix lands on main → ci.yml runs → if green,
  # this workflow fires and rebuilds the v0.1.0 release artifacts so
  # releases/latest/download/* always reflects the current main HEAD.
  # The release.yml job force-updates the v0.1.0 tag to point at the same
  # commit that just passed CI, then re-publishes the cosign-signed bundle.
  workflow_run:
    workflows: [ "ci" ]
    branches: [ main ]
    types: [ completed ]
  # Manual release from the GitHub Actions UI. Maintainer goes to
  # Actions → release → Run workflow → enters version (e.g. v0.1.1) →
  # workflow creates the tag at the chosen ref + builds + signs + publishes.
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (must match v*; e.g. v0.1.1). For auto-refresh of an existing tag (stable-tag contract), use v0.1.0.'
        required: true
        type: string
      ref:
        description: 'Git ref to tag (default: main)'
        required: false
        default: 'main'
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build + cosign-sign + publish
    runs-on: ubuntu-latest
    # Gate: when triggered by workflow_run, only proceed if ci.yml conclusion
    # is 'success'. Without this guard, every ci.yml FAILURE would also fire
    # this workflow (workflow_run is event-completion based, not result-based).
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For workflow_run, check out the exact commit ci.yml just validated
          # (not whatever main happens to be now — could have advanced).
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.ref }}

      - name: Resolve version + create-or-update tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.version }}"
          elif [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            # Stable-tag contract: auto-refresh path always retags v0.1.0 until
            # a real breaking change requires a bump. Change this literal when
            # the next minor/major lands.
            TAG="v0.1.0"
          else
            # push:tags path — TAG is the pushed ref itself.
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$TAG" =~ ^v ]] || { echo "::error::version must start with 'v' (got: $TAG)"; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Force-update the tag in case it already exists (re-release path).
          # The pilot v0.1.0 contract is "stable tag, refreshed artifacts" —
          # operators tracking 'releases/latest' get the newest signed build
          # without a version bump.
          git tag -fa "$TAG" -m "$TAG ($(git rev-parse --short HEAD))"
          git push --force origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Install Az modules into bundle layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path src/Modules/.az -Force | Out-Null
          $azModules = @(
            @{ Name = 'Az.Accounts';  Version = '5.4.0' }
            @{ Name = 'Az.KeyVault';  Version = '6.4.3' }
            @{ Name = 'Az.Storage';   Version = '7.5.0' }
          )
          foreach ($m in $azModules) {
            Save-Module -Name $m.Name -RequiredVersion $m.Version -Path src/Modules/.az -Force
          }
          # Flatten to Modules root (Az.Accounts/<ver>/... → Az.Accounts/...).
          # Create destination dir explicitly before Copy-Item -Recurse, otherwise
          # PowerShell can interpret a non-existent target as a leaf-name target
          # and throw "Container cannot be copied onto existing leaf item."
          Get-ChildItem src/Modules/.az -Directory | ForEach-Object {
            $modDir = $_
            $verDir = Get-ChildItem $modDir.FullName -Directory | Select-Object -First 1
            if ($verDir) {
              $dest = "src/Modules/$($modDir.Name)"
              New-Item -ItemType Directory -Path $dest -Force | Out-Null
              Copy-Item -Path (Join-Path $verDir.FullName '*') -Destination $dest -Recurse -Force
            }
          }
          Remove-Item src/Modules/.az -Recurse -Force

      - name: Build all generated artifacts
        shell: pwsh
        run: |
          pwsh ./tools/Build-Manifest.ps1
          pwsh ./tools/Build-DcrJson.ps1
          pwsh ./tools/Build-FunctionApp.ps1
          pwsh ./tools/Build-ArmTemplate.ps1
          pwsh ./tools/Build-SentinelSolution.ps1

      - name: Package function-app.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          # Zip src/ contents (host.json, profile.ps1, requirements.psd1, Modules/, functions/) into function-app.zip
          Compress-Archive -Path src/* -DestinationPath dist/function-app.zip -CompressionLevel Optimal
          $sizeMb = [math]::Round((Get-Item dist/function-app.zip).Length / 1MB, 2)
          Write-Host "function-app.zip: $sizeMb MB"
          if ($sizeMb -gt 200) { throw "function-app.zip exceeds 200 MB; SKU may reject." }

      - name: Stage ARM artifacts
        shell: pwsh
        run: |
          Copy-Item deploy/mainTemplate.json       dist/
          Copy-Item deploy/createUiDefinition.json dist/
          Copy-Item deploy/parameters.json         dist/
          Copy-Item deploy/sentinelContent.json    dist/

      - name: Package Sentinel Solution (Microsoft Content Hub input format)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # deploy/solution/ is the input folder layout Microsoft's
          # createSolutionV3.ps1 expects for Sentinel Content Hub submissions
          # (SolutionMetadata.json + Description.md + Data Connectors/ + empty
          # Analytic Rules/ Hunting Queries/ Parsers/ Workbooks/ Images/ for
          # v0.3.0 content fill-in). Operators submitting this to the public
          # Content Hub catalog drop this zip into Azure/Azure-Sentinel/
          # Solutions/XdrLogRaider/. For self-hosted Deploy-to-Azure, the
          # already-staged sentinelContent.json + mainTemplate.json are what
          # operators consume — this zip is forward-compat for v0.4.0
          # Content Hub PR.
          Compress-Archive -Path deploy/solution/* -DestinationPath dist/XdrLogRaider-Solution.zip -CompressionLevel Optimal
          Write-Host "XdrLogRaider-Solution.zip: $([math]::Round((Get-Item dist/XdrLogRaider-Solution.zip).Length / 1KB, 1)) KB"

      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        continue-on-error: true
        with:
          path: ./
          output-file: dist/sbom.spdx.json
          format: spdx-json

      - name: Cosign keyless OIDC sign (Sigstore → Fulcio → Rekor)
        uses: sigstore/cosign-installer@v3
      - shell: bash
        env:
          COSIGN_EXPERIMENTAL: 'true'
        run: |
          set -euo pipefail
          for f in dist/function-app.zip dist/mainTemplate.json dist/createUiDefinition.json dist/sentinelContent.json dist/XdrLogRaider-Solution.zip; do
            [[ -f "$f" ]] && cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.cert" "$f"
          done
          [[ -f dist/sbom.spdx.json ]] && cosign sign-blob --yes --output-signature dist/sbom.spdx.json.sig --output-certificate dist/sbom.spdx.json.cert dist/sbom.spdx.json || true
          ls -la dist/

      - name: Compute build metadata for release body
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "iso=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # tag_name must be set explicitly when this workflow is triggered by
          # workflow_dispatch or workflow_run: github.ref points at the branch
          # (refs/heads/main) not the tag, so the action can't infer the release
          # tag on its own.
          tag_name: ${{ steps.ver.outputs.tag }}
          name: XdrLogRaider ${{ steps.ver.outputs.tag }}
          body: |
            XdrLogRaider Defender XDR portal-only telemetry connector.

            **Last refreshed: ${{ steps.meta.outputs.iso }}** (commit `${{ steps.meta.outputs.sha }}`)

            > GitHub's "published" timestamp on this page reflects the FIRST
            > release of this tag — the artifacts themselves are continuously
            > refreshed on every green main-branch CI run (stable-tag contract).
            > Trust the "Last refreshed" line above + the individual asset dates.

            Deploy via the one-click ARM button in the README, or via
            `az deployment group create` using the included parameters.json.

            All artifacts are signed with Sigstore cosign keyless OIDC (Fulcio
            short-lived cert + Rekor transparency log).
            Verify with: `cosign verify-blob --certificate <file>.cert --signature <file>.sig <file>`.
          files: |
            dist/function-app.zip
            dist/function-app.zip.sig
            dist/function-app.zip.cert
            dist/mainTemplate.json
            dist/mainTemplate.json.sig
            dist/mainTemplate.json.cert
            dist/createUiDefinition.json
            dist/createUiDefinition.json.sig
            dist/createUiDefinition.json.cert
            dist/sentinelContent.json
            dist/sentinelContent.json.sig
            dist/sentinelContent.json.cert
            dist/XdrLogRaider-Solution.zip
            dist/XdrLogRaider-Solution.zip.sig
            dist/XdrLogRaider-Solution.zip.cert
            dist/parameters.json
            dist/sbom.spdx.json
            dist/sbom.spdx.json.sig
            dist/sbom.spdx.json.cert
