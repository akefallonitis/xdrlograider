  /admin/api/contentunderstanding/licensing:
    get:
      summary: Get content understanding licensing
      description: >-
        Retrieve the licensing information for content understanding (Syntex)
        services including available capacity and consumption.
      operationId: ContentUnderstanding.GetLicensing
      tags: [ContentUnderstanding]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/ContentUnderstandingLicensingResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
