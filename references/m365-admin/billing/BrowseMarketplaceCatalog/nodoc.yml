  /fd/bsxcommerce/v1/moderncatalog/browsecatalog:
    get:
      summary: Browse marketplace catalog
      description: >-
        Retrieve read-only marketplace catalog browse results used by the Microsoft 365
        marketplace landing experience. This capture reflects page-load catalog reads,
        not a checkout or purchase submission.
      operationId: Billing.BrowseMarketplaceCatalog
      tags: [Billing]
      parameters:
        - name: productfamily
          in: query
          schema:
            type: string
        - name: offerType
          in: query
          schema:
            type: string
        - name: market
          in: query
          schema:
            type: string
        - name: fieldsTemplate
          in: query
          schema:
            type: string
        - name: actionFilter
          in: query
          schema:
            type: string
        - name: pricingAudience
          in: query
          schema:
            type: string
        - name: nationalCloud
          in: query
          schema:
            type: string
        - name: filterCategoryProducts
          in: query
          schema:
            type: boolean
        - name: stateFilter
          in: query
          schema:
            type: string
        - name: accountId
          in: query
          schema:
            type: string
        - name: orgId
          in: query
          schema:
            type: string
        - name: bgId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: Marketplace catalog result group. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
