  /admin/api/users/contextualalerts:
    post:
      summary: Get contextual alerts
      description: >-
        Retrieve contextual alerts for the current admin user session.
      operationId: UsersGroups.GetContextualAlerts
      tags: [UsersGroups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Empty object. No properties required.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Contextual alerts. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
