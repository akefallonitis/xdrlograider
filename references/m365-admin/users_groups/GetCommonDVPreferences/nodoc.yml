  /admin/api/users/getcommondvpreferences:
    get:
      summary: Get common DV preferences
      description: >-
        Retrieve common data visualization preferences for the current user.
      operationId: UsersGroups.GetCommonDVPreferences
      tags: [UsersGroups]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Common dashboard view preferences and teaching-bubble state for the current admin.
              example:
                CommonDashboardViewPreferences:
                  ViewToShow: Default
                  ShowDashboardSwitcherTeachingBubble: true
                  EligibleDashboards:
                    - SimplifiedView
                    - Health
                    - Default
                  DismissProductFeedbackTopActions: null
                  DismissDashboardHeaderTeachingBubble: null
                  DismissDynamicCommandBarTeachingBubble: false
                  ShouldShowDashboardHeaderTeachingBubble: true
                CurrentViewInfo: null
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
