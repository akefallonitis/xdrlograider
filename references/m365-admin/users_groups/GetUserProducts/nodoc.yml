  /admin/api/users/products:
    get:
      summary: Get user products
      description: >-
        Retrieve the products and licenses associated with the current user.
      operationId: UsersGroups.GetUserProducts
      tags: [UsersGroups]
      parameters:
        - $ref: common.yml#/components/parameters/ODataFilter
        - $ref: common.yml#/components/parameters/ODataTop
        - $ref: common.yml#/components/parameters/ODataSkip
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: User license inventory with SKU availability and per-plan selection state.
              example:
                UserId: 00000000-0000-0000-0000-000000000000
                Products:
                  - ProductSkuId: f30db892-07e9-47e9-837c-80727f46fd3d
                    AccountName: contoso
                    SkuPartNumber: FLOW_FREE
                    IsSelected: false
                    IsPreviouslySelected: false
                    IsDisabled: false
                    IsLicenseDisabledState: false
                    IsAssignable: true
                    ProductDisplayName: Microsoft Power Automate Free
                    TotalUnits: 10000
                    AvailableUnits: 9997
                    WarningUnits: 0
                    HasUnlimitedSeats: false
                    ServicePlans:
                      - ServicePlan:
                          ServiceName: DYN365_CDS_VIRAL
                          ServicePlanId: 17ab22cd-a0b3-4536-910a-cb6eb12696c0
                          ServiceType: CRM
                          TargetClass: 1
                          AppliesTo: null
                        ServicePlanDisplayName: Common Data Service
                        IsSelected: true
                        IsDisabled: false
                        IsServicePlanTenantLevel: false
                        HideServicePlan: false
                        IsGroupBased: false
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
