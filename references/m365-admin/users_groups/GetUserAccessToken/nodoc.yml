  /admin/api/users/getuseraccesstoken:
    get:
      summary: Get user access token
      description: >-
        Retrieve an access token for the current authenticated user.
      operationId: UsersGroups.GetUserAccessToken
      tags: [UsersGroups]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: User access token. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
