  /admin/api/users/getavailableroles:
    get:
      summary: Get available roles
      description: >-
        Retrieve the list of available admin roles that can be assigned to users (Users > Active).
      operationId: UsersGroups.GetAvailableRoles
      tags: [UsersGroups]
      parameters:
        - $ref: common.yml#/components/parameters/ODataFilter
        - $ref: common.yml#/components/parameters/ODataTop
        - $ref: common.yml#/components/parameters/ODataSkip
        - $ref: common.yml#/components/parameters/ODataOrderBy
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
