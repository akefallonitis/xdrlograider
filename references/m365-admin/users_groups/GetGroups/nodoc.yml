  /admin/api/groups/GetGroups:
    post:
      summary: Get groups
      description: >-
        Retrieve a paginated list of groups in the tenant with sorting and filtering options.
      operationId: UsersGroups.GetGroups
      tags: [UsersGroups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                PageToken:
                  type: string
                  nullable: true
                  description: Pagination token for subsequent pages.
                GroupTypes:
                  type: string
                  nullable: true
                  description: Filter by group types.
                SearchString:
                  type: string
                  description: Search string to filter groups.
                  default: ''
                SortDirection:
                  type: integer
                  description: Sort direction (0 = ascending, 1 = descending).
                  default: 0
                SortField:
                  type: string
                  description: Field name to sort by.
                  default: GroupName
      x-nodoc-operation-context:
        surface: Users > Groups
        workflows:
          - Open Groups and page or filter the tenant group inventory.
        headerProfile: m365-admin-homepage
        requestShapes:
          - name: paginated-group-list
            contentType: application/json
            bodyKind: query-object
            requiredParameters:
              - SearchString
              - SortDirection
              - SortField
            notes: The portal uses body parameters instead of query parameters for paging and filtering.
        variants:
          - location: body
            selector: GroupTypes
            notes: GroupTypes narrows the result set to a specific group family.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Paginated group list. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
