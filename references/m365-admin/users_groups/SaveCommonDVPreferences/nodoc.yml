  /admin/api/users/savecommondvpreferences:
    post:
      summary: Save common DV preferences
      description: >-
        Save common data visualization preferences for the current user.
      operationId: UsersGroups.SaveCommonDVPreferences
      tags: [UsersGroups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Common data visualization preferences to save. Exact schema pending.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
