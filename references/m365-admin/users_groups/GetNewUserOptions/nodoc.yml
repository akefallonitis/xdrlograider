  /admin/api/users/new/options:
    get:
      summary: Get new user options
      description: >-
        Retrieve options and configuration for creating new users or contacts (Users > Contacts).
      operationId: UsersGroups.GetNewUserOptions
      tags: [UsersGroups]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
