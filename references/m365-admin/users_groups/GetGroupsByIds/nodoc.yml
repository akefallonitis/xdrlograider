  /admin/api/groups/getgroupsbyids:
    post:
      summary: Get groups by IDs
      description: >-
        Retrieve specific groups by their IDs, used for group lookups in settings like custom themes (Org Settings > Custom themes).
      operationId: UsersGroups.GetGroupsByIds
      tags: [UsersGroups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: pending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
