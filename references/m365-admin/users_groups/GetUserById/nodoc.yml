  /admin/api/users/{userId}:
    get:
      summary: Get user by ID
      description: >-
        Retrieve detailed information for a specific user by their user ID (Reports > Usage).
      operationId: UsersGroups.GetUserById
      tags: [UsersGroups]
      parameters:
        - name: userId
          in: path
          required: true
          description: The unique identifier of the user.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
