  /admin/api/users/dashboardlayout:
    get:
      summary: Get dashboard layout
      description: >-
        Retrieve the dashboard layout preferences for the current user.
      operationId: UsersGroups.GetDashboardLayout
      tags: [UsersGroups]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Dashboard layout preferences stored for the current admin.
              example: {}
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
