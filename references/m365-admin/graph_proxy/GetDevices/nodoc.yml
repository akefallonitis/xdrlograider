  /fd/msgraph/v1.0/devices:
    get:
      summary: Get devices
      description: >-
        Retrieve the list of Entra ID registered devices for the tenant,
        proxied through the M365 Admin Center to Microsoft Graph.
      operationId: GraphProxy.GetDevices
      tags: [GraphProxy]
      parameters:
        - name: $count
          in: query
          description: Include a count of the total number of items.
          schema:
            type: boolean
            default: true
        - name: $top
          in: query
          description: Maximum number of items to return.
          schema:
            type: integer
            default: 1
        - name: ConsistencyLevel
          in: header
          description: Consistency level for the request. Required for count queries.
          schema:
            type: string
            default: eventual
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '@odata.count':
                    type: integer
                    description: Total count of devices.
                  value:
                    type: array
                    items:
                      type: object
                      description: Device details. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
