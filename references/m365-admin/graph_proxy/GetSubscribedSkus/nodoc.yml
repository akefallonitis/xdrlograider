  /fd/msgraph/v1.0/subscribedSkus:
    get:
      summary: Get subscribed SKUs
      description: >-
        Retrieve the list of commercial subscriptions (SKUs) that the tenant has acquired,
        proxied through the M365 Admin Center to Microsoft Graph.
      operationId: GraphProxy.GetSubscribedSkus
      tags: [GraphProxy]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscribedSku'
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
