  /fd/msgraph/beta/deviceManagement/configurationPolicies:
    get:
      summary: List device management configuration policies
      description: >-
        Retrieve device management configuration policies via the Graph beta proxy,
        including filtered and paged policy lists.
      operationId: GraphProxy.ListDeviceManagementConfigurationPolicies
      tags: [GraphProxy]
      parameters:
        - name: $filter
          in: query
          description: OData filter expression applied to the configuration policy list.
          schema:
            type: string
        - name: $skiptoken
          in: query
          description: Server-issued paging token for the next policy result page.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '@odata.context':
                    type: string
                  '@odata.nextLink':
                    type: string
                  value:
                    type: array
                    items:
                      type: object
                      description: Device management configuration policy. Exact schema pending.
                additionalProperties: true
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
