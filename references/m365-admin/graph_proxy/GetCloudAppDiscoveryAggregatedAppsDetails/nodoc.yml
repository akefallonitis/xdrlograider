  /fd/MsGraph/beta/security/dataDiscovery/cloudAppDiscovery/uploadedStreams/{streamId}/microsoft.graph.security.aggregatedAppsDetails(period=duration'P90D'):
    get:
      summary: Get cloud app discovery aggregated app details
      description: >-
        Retrieve the 90-day aggregated app detail set for a specific uploaded stream,
        optionally filtered by category.
      operationId: GraphProxy.GetCloudAppDiscoveryAggregatedAppsDetails
      tags: [GraphProxy]
      parameters:
        - name: streamId
          in: path
          required: true
          description: The uploaded stream identifier.
          schema:
            type: string
        - name: $filter
          in: query
          description: OData filter expression applied to the aggregated app detail set.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '@odata.context':
                    type: string
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        displayName:
                          type: string
                        category:
                          type: string
                        riskScore:
                          type: integer
                        lastSeenDateTime:
                          type: string
                          format: date-time
                        userCount:
                          type: integer
                        transactionCount:
                          type: integer
                        deviceCount:
                          type: integer
                      additionalProperties: true
                additionalProperties: true
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
