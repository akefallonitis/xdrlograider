  /admin/api/agentssettings/mcpservers:
    get:
      summary: Get MCP servers
      description: >-
        Retrieve the list of Model Context Protocol (MCP) servers configured for agent tools
        in the tenant.
      operationId: Agents.GetMcpServers
      tags: [Agents]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: MCP server configurations. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
