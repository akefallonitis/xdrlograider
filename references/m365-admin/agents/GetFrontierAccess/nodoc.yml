  /admin/api/settings/company/frontier/access:
    get:
      summary: Get Frontier access policy
      description: >-
        Retrieve the Frontier (agent) access policy for the tenant, controlling which
        users and groups can access agent capabilities.
      operationId: Agents.GetFrontierAccess
      tags: [Agents]
      x-nodoc-operation-context:
        surface: Copilot > Agents
        workflows:
          - Open the Copilot agent administration experience and inspect access controls.
        headerProfile: m365-admin-homepage
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Frontier access policy settings. Exact schema pending.
                properties:
                  FrontierPolicy:
                    type: object
                    description: The Frontier access policy configuration.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set Frontier access policy
      description: >-
        Update the Frontier (agent) access policy for the tenant. Merges provided settings
        into the existing policy configuration.
      operationId: Agents.SetFrontierAccess
      tags: [Agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Merged Frontier policy payload. Properties are merged with current settings.
              properties:
                FrontierPolicy:
                  type: object
                  description: The Frontier access policy configuration to update.
      x-nodoc-operation-context:
        surface: Copilot > Agents
        workflows:
          - Open the Copilot agent administration experience and save access policy changes.
        headerProfile: m365-admin-homepage
        requestShapes:
          - name: merged-frontier-policy
            contentType: application/json
            bodyKind: object-merge
            notes: The portal merges the supplied FrontierPolicy object into the current server document.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
