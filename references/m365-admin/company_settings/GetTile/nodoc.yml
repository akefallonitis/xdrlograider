  /admin/api/Settings/company/tile:
    get:
      summary: Get custom tile settings
      description: >-
        Retrieve custom tiles configured for the app launcher.
      operationId: CompanySettings.GetTile
      tags: [CompanySettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - custom tile settings
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set custom tile settings
      description: >-
        Create or update custom tiles in the app launcher.
      operationId: CompanySettings.SetTile
      tags: [CompanySettings]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: pending - custom tile update body
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
