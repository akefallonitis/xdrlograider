  /_api/SPOInternalUseOnly.TenantAdminSettings/AutoQuotaEnabled:
    get:
      summary: Get SharePoint auto-quota setting
      description: >-
        Retrieve whether SharePoint Online auto quota assignment is enabled for new
        site collections.
      operationId: CompanySettings.GetSharePointAutoQuotaEnabled
      tags: [CompanySettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '@odata.context':
                    type: string
                  IsReadOnly:
                    type: boolean
                  Value:
                    type: boolean
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    put:
      summary: Set company theme
      description: >-
        Update the company branding theme settings.
      operationId: CompanySettings.SetTheme
      tags: [CompanySettings]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: pending - theme update body
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
