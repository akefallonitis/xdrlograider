  /admin/api/Settings/company/helpdesk:
    get:
      summary: Get helpdesk settings
      description: >-
        Retrieve the custom helpdesk contact information displayed to users.
      operationId: CompanySettings.GetHelpdesk
      tags: [CompanySettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - helpdesk settings
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set helpdesk settings
      description: >-
        Update the custom helpdesk contact information.
      operationId: CompanySettings.SetHelpdesk
      tags: [CompanySettings]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: pending - helpdesk update body
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
