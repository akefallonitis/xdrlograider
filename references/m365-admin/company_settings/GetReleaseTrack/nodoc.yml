  /admin/api/Settings/company/releasetrack:
    get:
      summary: Get release track settings
      description: >-
        Retrieve the release preferences (targeted release, standard release)
        for the tenant.
      operationId: CompanySettings.GetReleaseTrack
      tags: [CompanySettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - release track settings
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set release track settings
      description: >-
        Update the release preferences for the tenant.
      operationId: CompanySettings.SetReleaseTrack
      tags: [CompanySettings]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: pending - release track update body
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
