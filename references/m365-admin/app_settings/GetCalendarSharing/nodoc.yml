  /admin/api/settings/apps/calendarsharing:
    get:
      summary: Get Calendar Sharing settings
      description: >-
        Retrieve the Calendar Sharing application settings for the tenant.
      operationId: AppSettings.GetCalendarSharing
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Calendar Sharing settings. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set Calendar Sharing settings
      description: >-
        Update the Calendar Sharing application settings for the tenant.
      operationId: AppSettings.SetCalendarSharing
      tags: [AppSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Merged Calendar Sharing settings payload.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
