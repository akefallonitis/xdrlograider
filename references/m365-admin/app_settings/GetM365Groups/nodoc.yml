  /admin/api/settings/apps/m365groups:
    get:
      summary: Get Microsoft 365 Groups settings
      description: >-
        Retrieve the Microsoft 365 Groups application settings for the tenant.
      operationId: AppSettings.GetM365Groups
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Microsoft 365 Groups settings. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set Microsoft 365 Groups settings
      description: >-
        Update the Microsoft 365 Groups application settings for the tenant.
      operationId: AppSettings.SetM365Groups
      tags: [AppSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Merged M365 Groups settings payload.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
