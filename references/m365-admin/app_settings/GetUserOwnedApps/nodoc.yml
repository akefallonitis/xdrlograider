  /admin/api/settings/apps/userownedapps:
    get:
      summary: Get user-owned apps settings
      description: >-
        Retrieve the user-owned apps and services settings for the tenant.
      operationId: AppSettings.GetUserOwnedApps
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: User-owned apps settings. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set user-owned apps settings
      description: >-
        Update the user-owned apps and services settings for the tenant.
      operationId: AppSettings.SetUserOwnedApps
      tags: [AppSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Merged user-owned apps settings payload.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
