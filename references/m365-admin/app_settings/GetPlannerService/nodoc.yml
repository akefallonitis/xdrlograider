  /admin/api/services/apps/planner:
    get:
      summary: Get Planner service settings
      description: >-
        Retrieve the Microsoft Planner service-level settings for the tenant (Org Settings > Microsoft Planner).
      operationId: AppSettings.GetPlannerService
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
