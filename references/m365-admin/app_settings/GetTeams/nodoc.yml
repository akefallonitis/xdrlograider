  /admin/api/settings/apps/skypeteams:
    get:
      summary: Get Microsoft Teams settings
      description: >-
        Retrieve the Microsoft Teams application settings for the tenant.
      operationId: AppSettings.GetTeams
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/TeamsSettingsResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set Microsoft Teams settings
      description: >-
        Update the Microsoft Teams application settings for the tenant.
      operationId: AppSettings.SetTeams
      tags: [AppSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Merged Teams settings payload.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
