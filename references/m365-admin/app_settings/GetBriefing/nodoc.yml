  /admin/api/settings/apps/briefing:
    get:
      summary: Get Briefing email settings
      description: >-
        Retrieve the Briefing email application settings for the tenant.
      operationId: AppSettings.GetBriefing
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Briefing email settings. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set Briefing email settings
      description: >-
        Update the Briefing email application settings for the tenant.
      operationId: AppSettings.SetBriefing
      tags: [AppSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Merged Briefing settings payload.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
