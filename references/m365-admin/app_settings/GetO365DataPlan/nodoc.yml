  /admin/api/settings/apps/o365dataplan:
    get:
      summary: Get Microsoft Graph Data Connect settings
      description: >-
        Retrieve the Microsoft Graph Data Connect (O365 data plan) settings for the tenant (Org Settings > Microsoft Graph Data Connect).
      operationId: AppSettings.GetO365DataPlan
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
