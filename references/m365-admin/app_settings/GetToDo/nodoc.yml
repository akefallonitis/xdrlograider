  /admin/api/settings/apps/todo:
    get:
      summary: Get To Do settings
      description: >-
        Retrieve the Microsoft To Do application settings for the tenant.
      operationId: AppSettings.GetToDo
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: To Do application settings. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set To Do settings
      description: >-
        Update the Microsoft To Do application settings for the tenant.
      operationId: AppSettings.SetToDo
      tags: [AppSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Merged To Do settings payload.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
