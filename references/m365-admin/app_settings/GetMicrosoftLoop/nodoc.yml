  /admin/api/settings/apps/MicrosoftLoop:
    get:
      summary: Get Microsoft Loop settings
      description: >-
        Retrieve the Microsoft Loop application settings for the tenant.
        Also accessible via the looppolicy endpoint alias.
      operationId: AppSettings.GetMicrosoftLoop
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Microsoft Loop settings. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set Microsoft Loop settings
      description: >-
        Update the Microsoft Loop application settings for the tenant.
      operationId: AppSettings.SetMicrosoftLoop
      tags: [AppSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Merged Loop settings payload.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
