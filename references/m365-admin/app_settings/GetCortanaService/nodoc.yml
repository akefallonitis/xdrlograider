  /admin/api/services/apps/cortana:
    get:
      summary: Get Cortana service settings
      description: >-
        Retrieve the Cortana service-level settings for the tenant (Org Settings > Cortana).
      operationId: AppSettings.GetCortanaService
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
