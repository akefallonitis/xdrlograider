  /admin/api/services/apps/modernAuth:
    get:
      summary: Get modern authentication settings
      description: >-
        Retrieve the modern authentication service settings for the tenant (Org Settings > Modern Auth).
      operationId: AppSettings.GetModernAuth
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
