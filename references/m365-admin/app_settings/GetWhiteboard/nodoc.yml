  /admin/api/settings/apps/whiteboard:
    get:
      summary: Get Whiteboard settings
      description: >-
        Retrieve the Microsoft Whiteboard application settings for the tenant.
      operationId: AppSettings.GetWhiteboard
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Whiteboard application settings. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set Whiteboard settings
      description: >-
        Update the Microsoft Whiteboard application settings for the tenant.
      operationId: AppSettings.SetWhiteboard
      tags: [AppSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Merged Whiteboard settings payload.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
