  /admin/api/settings/apps/sitessharing:
    get:
      summary: Get sites sharing settings
      description: >-
        Retrieve the SharePoint sites sharing settings for the tenant (Org Settings > Sites).
      operationId: AppSettings.GetSitesSharing
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
