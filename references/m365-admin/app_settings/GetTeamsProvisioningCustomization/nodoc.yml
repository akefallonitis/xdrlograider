  /admin/api/TeamsProvisioning/Customization:
    get:
      summary: Get Teams provisioning customization flag
      description: >-
        Retrieve the boolean customization flag used by the Teams provisioning
        experience in the admin center.
      operationId: AppSettings.GetTeamsProvisioningCustomization
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
                example: false
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
