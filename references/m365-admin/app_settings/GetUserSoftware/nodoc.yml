  /admin/api/settings/apps/usersoftware:
    get:
      summary: Get M365 installation options
      description: >-
        Retrieve the Microsoft 365 installation options (user software) settings for the tenant (Org Settings > M365 installation options).
      operationId: AppSettings.GetUserSoftware
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound