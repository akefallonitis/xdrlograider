  /admin/api/settings/apps/learning:
    get:
      summary: Get Viva Learning settings
      description: >-
        Retrieve the Viva Learning application settings for the tenant.
      operationId: AppSettings.GetLearning
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Viva Learning settings. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set Viva Learning settings
      description: >-
        Update the Viva Learning application settings for the tenant.
      operationId: AppSettings.SetLearning
      tags: [AppSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Merged Learning settings payload.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
