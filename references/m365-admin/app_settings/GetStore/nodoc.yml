  /admin/api/settings/apps/store:
    get:
      summary: Get Store settings
      description: >-
        Retrieve the Microsoft Store (user-owned apps and services) settings for the tenant.
      operationId: AppSettings.GetStore
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Store settings. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Set Store settings
      description: >-
        Update the Microsoft Store settings for the tenant.
      operationId: AppSettings.SetStore
      tags: [AppSettings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Merged Store settings payload.
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
