  /admin/api/services/apps/myanalytics:
    get:
      summary: Get MyAnalytics settings
      description: >-
        Retrieve the MyAnalytics (Viva Insights personal) service settings for the tenant (Org Settings > MyAnalytics).
      operationId: AppSettings.GetMyAnalytics
      tags: [AppSettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
