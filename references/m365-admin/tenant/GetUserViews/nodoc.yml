  /admin/api/tenant/userviews:
    get:
      summary: Get user views
      description: >-
        Retrieve the configured user views for the tenant admin portal (Users > Active).
      operationId: Tenant.GetUserViews
      tags: [Tenant]
      parameters:
        - $ref: common.yml#/components/parameters/ODataFilter
        - $ref: common.yml#/components/parameters/ODataTop
        - $ref: common.yml#/components/parameters/ODataSkip
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
