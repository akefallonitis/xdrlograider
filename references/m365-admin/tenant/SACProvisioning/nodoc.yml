  /admin/api/tenant/SACProvisioning:
    post:
      summary: SAC provisioning
      description: >-
        Trigger Self-service Account Creation (SAC) provisioning for the tenant (Users > Active).
      operationId: Tenant.SACProvisioning
      tags: [Tenant]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: pending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
