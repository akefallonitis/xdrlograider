  /admin/api/Tenant/StartOfflineProcesses:
    get:
      summary: Start offline processes
      description: >-
        Start tenant offline processes for background data processing.
      operationId: Tenant.StartOfflineProcesses
      tags: [Tenant]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Offline processes status. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
