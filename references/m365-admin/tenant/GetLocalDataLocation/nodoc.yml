  /admin/api/tenant/localdatalocation:
    get:
      summary: Get local data location
      description: >-
        Retrieve the local data location information for the tenant.
      operationId: Tenant.GetLocalDataLocation
      tags: [Tenant]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/LocalDataLocationResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
