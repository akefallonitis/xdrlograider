  /admin/api/selfServicePurchasePolicy/products:
    get:
      summary: Get self-service purchase products
      description: >-
        Retrieve the list of products available for self-service purchase
        and their policy settings (enabled/disabled).
      operationId: Tenant.GetSelfServicePurchaseProducts
      tags: [Tenant]
      parameters:
        - $ref: common.yml#/components/parameters/ODataFilter
        - $ref: common.yml#/components/parameters/ODataTop
        - $ref: common.yml#/components/parameters/ODataSkip
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: pending - self-service purchase product details
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
