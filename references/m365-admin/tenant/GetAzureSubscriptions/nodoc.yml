  /admin/api/tenant/azureSubscriptions:
    get:
      summary: Get Azure subscriptions
      description: >-
        Retrieve the Azure subscriptions associated with the tenant.
      operationId: Tenant.GetAzureSubscriptions
      tags: [Tenant]
      parameters:
        - $ref: common.yml#/components/parameters/ODataFilter
        - $ref: common.yml#/components/parameters/ODataTop
        - $ref: common.yml#/components/parameters/ODataSkip
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: pending - Azure subscription details
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
