  /admin/api/rememberpreferences:
    get:
      summary: Get remembered preferences
      description: >-
        Retrieve remembered user preferences for the admin portal.
      operationId: Misc.GetRememberPreferences
      tags: [Miscellaneous]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: common.yml#/components/schemas/PreferenceGroup
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
