  /admin/api/irisrecommendations/v1:
    get:
      summary: Get IRIS recommendations
      description: >-
        Retrieve IRIS (Intelligent Recommendations and Insights Service) recommendations for the tenant (Org Settings > Briefing email).
      operationId: Misc.GetIrisRecommendations
      tags: [Miscellaneous]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
