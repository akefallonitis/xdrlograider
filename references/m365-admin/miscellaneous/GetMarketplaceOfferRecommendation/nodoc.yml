  /admin/api/offerrec/marketplaceoffer:
    get:
      summary: Get marketplace offer recommendation
      description: >-
        Retrieve the marketplace offer recommendation payload used by the admin center
        marketplace landing experience.
      operationId: Misc.GetMarketplaceOfferRecommendation
      tags: [Billing]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  OfferRecommendationName:
                    type: integer
                  Data:
                    type: object
                    nullable: true
                    additionalProperties: true
                  PersonalizedContent:
                    type: object
                    nullable: true
                    additionalProperties: true
                additionalProperties: true
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
