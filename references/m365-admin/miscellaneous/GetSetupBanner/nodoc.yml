  /admin/api/setupwizard/setupbanner:
    get:
      summary: Get setup wizard banner
      description: >-
        Retrieve the setup wizard banner status for the admin portal.
      operationId: Misc.GetSetupBanner
      tags: [Miscellaneous]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Setup wizard banner status. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
