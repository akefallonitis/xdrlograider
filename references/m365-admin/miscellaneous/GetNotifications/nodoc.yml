  /admin/api/notifications:
    get:
      summary: Get admin notifications
      description: >-
        Retrieve admin notifications for the current user.
      operationId: Misc.GetNotifications
      tags: [Miscellaneous]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/NotificationPollResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
