  /fd/iris:
    get:
      summary: Get IRIS placement content
      description: >-
        Retrieve IRIS placement content and recommendation payloads used by the admin
        center homepage. The observed live tenant returned a no-content placement error
        for the requested slot.
      operationId: Misc.GetIrisPlacement
      tags: [Miscellaneous]
      parameters:
        - name: placement
          in: query
          description: Placement identifier requested by the client. Some homepage probes send `undefined`.
          schema:
            type: string
        - name: nct
          in: query
          description: Numeric content type discriminator.
          schema:
            type: integer
        - name: country
          in: query
          description: Country code associated with the request context.
          schema:
            type: string
        - name: locale
          in: query
          description: Locale associated with the request context.
          schema:
            type: string
        - name: bcnt
          in: query
          description: Homepage batch-count discriminator.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  batchrsp:
                    type: object
                    properties:
                      ver:
                        type: string
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: integer
                            msg:
                              type: string
                          additionalProperties: true
                    additionalProperties: true
                additionalProperties: true
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
