  /admin/api/servicehealth/status/activeCM:
    get:
      summary: Get active change management status
      description: >-
        Retrieve active change management incidents and service health status (Org Settings > Briefing email).
      operationId: ServiceHealth.GetActiveCM
      tags: [ServiceHealth]
      parameters:
        - $ref: common.yml#/components/parameters/ODataFilter
        - $ref: common.yml#/components/parameters/ODataTop
        - $ref: common.yml#/components/parameters/ODataSkip
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound