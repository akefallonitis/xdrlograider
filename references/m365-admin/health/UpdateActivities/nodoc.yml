  /admin/api/messagecenter/activities:
    put:
      summary: Update message center activities
      description: >-
        Update message center activity tracking such as read/unread status and preferences (Health > Message center).
      operationId: MessageCenter.UpdateActivities
      tags: [MessageCenter]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: pending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
