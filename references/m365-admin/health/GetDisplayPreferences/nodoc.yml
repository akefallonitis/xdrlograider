  /admin/api/servicehealth/getDisplayPreferences:
    get:
      summary: Get service health display preferences
      description: >-
        Retrieve display preferences for the service health dashboard (Health > Service health).
      operationId: ServiceHealth.GetDisplayPreferences
      tags: [ServiceHealth]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
