  /admin/api/securitysettings/settings/status:
    get:
      summary: Get secure-by-default control status
      description: >-
        Retrieve per-control status results, including links and exclusion metadata
        for settings that are at risk or customized.
      operationId: SecuritySettings.GetSecurityControlsStatus
      tags: [SecuritySettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/SecuritySettingsStatusResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound