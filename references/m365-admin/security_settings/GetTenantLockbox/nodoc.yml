  /admin/api/settings/security/tenantLockbox:
    get:
      summary: Get tenant lockbox settings
      description: >-
        Retrieve the tenant lockbox (privileged access) settings for the tenant (Org Settings > Privileged access).
      operationId: SecuritySettings.GetTenantLockbox
      tags: [SecuritySettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
