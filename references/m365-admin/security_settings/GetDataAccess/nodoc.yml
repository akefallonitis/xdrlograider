  /admin/api/settings/security/dataaccess:
    get:
      summary: Get customer lockbox data access settings
      description: >-
        Retrieve the customer lockbox data access settings for the tenant (Org Settings > Customer lockbox).
      operationId: SecuritySettings.GetDataAccess
      tags: [SecuritySettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
