  /admin/api/securitysettings/optIn:
    get:
      summary: Get secure-by-default opt-in status
      description: >-
        Retrieve the opt-in envelope used by the secure-by-default experience. The
        observed response body was an empty JSON object.
      operationId: SecuritySettings.GetSecurityControlsOptIn
      tags: [SecuritySettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/EmptyObjectResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
