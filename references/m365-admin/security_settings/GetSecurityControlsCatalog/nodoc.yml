  /admin/api/securitysettings/settings:
    get:
      summary: Get secure-by-default settings catalog
      description: >-
        Retrieve the catalog of secure-by-default controls shown in Org Settings >
        Security & privacy.
      operationId: SecuritySettings.GetSecurityControlsCatalog
      tags: [SecuritySettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/SecuritySettingsCatalogResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
