  /admin/api/settings/security/passwordpolicy:
    get:
      summary: Get password expiration policy
      description: >-
        Retrieve the password expiration policy settings for the tenant (Org Settings > Password expiration).
      operationId: SecuritySettings.GetPasswordPolicy
      tags: [SecuritySettings]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
