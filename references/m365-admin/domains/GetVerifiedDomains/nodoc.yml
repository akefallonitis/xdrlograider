  /admin/api/Domains/Verified:
    get:
      summary: Get verified domains
      description: >-
        Retrieve the list of verified domains for the tenant (Users > Active).
      operationId: Domains.GetVerifiedDomains
      tags: [Domains]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Name:
                      type: string
                    IsDefault:
                      type: boolean
                    IsInitial:
                      type: boolean
                    Authentication:
                      type: integer
                    Capabilities:
                      type: integer
                    RootDomain:
                      type: string
                    Status:
                      type: integer
                    VerificationMethod:
                      type: integer
                    PasswordNotificationWindowInDays:
                      type: integer
                      nullable: true
                    PasswordValidityPeriodInDays:
                      type: integer
                      nullable: true
                  additionalProperties: true
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
