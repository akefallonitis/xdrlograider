  /admin/api/Domains/List:
    get:
      summary: List domains
      description: >-
        Retrieve the list of domains configured for the tenant (Org Settings > Privacy profile).
      operationId: Domains.ListDomains
      tags: [Domains]
      parameters:
        - name: filter
          in: query
          description: Optional domain filter expression.
          schema:
            type: string
        - name: searchText
          in: query
          description: Optional search text applied by the Domains grid.
          schema:
            type: string
        - name: computeDomainRegistrationData
          in: query
          description: Whether registration metadata should be included in the response.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    Name:
                      type: string
                    IsDefault:
                      type: boolean
                    IsInitial:
                      type: boolean
                    Capabilities:
                      type: integer
                    Authentication:
                      type: integer
                    Status:
                      type: string
                    DomainType:
                      type: string
                    IsReseller:
                      type: boolean
                    ShouldSetupDns:
                      type: boolean
                    IsSetupCompleted:
                      type: boolean
                    DnsHealthStatus:
                      type: string
                    DnsProviderName:
                      type: string
                  additionalProperties: true
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
