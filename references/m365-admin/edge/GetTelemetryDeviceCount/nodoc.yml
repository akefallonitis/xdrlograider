  /fd/edgeenterpriseextensionsmanagement/api/telemetry/devices/count:
    get:
      summary: Get Edge telemetry device count
      description: >-
        Retrieve the Edge-managed device count for the requested telemetry lookback window.
      operationId: Edge.GetTelemetryDeviceCount
      tags: [Edge]
      parameters:
        - name: lookbackHours
          in: query
          description: Lookback window, in hours, applied to the device telemetry query.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Device telemetry count payload. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
