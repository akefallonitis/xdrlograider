  /fd/edgeenterpriseextensionsmanagement/api/version/releases:
    get:
      summary: List Edge release versions
      description: >-
        Retrieve release information for the requested Edge channel.
      operationId: Edge.ListReleaseVersions
      tags: [Edge]
      parameters:
        - name: channel
          in: query
          description: Edge release channel requested by the portal.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Edge release version payload. Exact schema pending.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
