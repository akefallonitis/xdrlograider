  /admin/api/reports/GetReportTileData:
    get:
      summary: Get report tile data
      description: >-
        Retrieve tile data for the usage reports dashboard including summary metrics (Reports > Usage).
      operationId: Reports.GetReportTileData
      tags: [Reports]
      parameters:
        - name: period
          in: query
          description: Reporting period (e.g., D7, D30, D90, D180).
          schema:
            type: string
            enum: [D7, D30, D90, D180]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
