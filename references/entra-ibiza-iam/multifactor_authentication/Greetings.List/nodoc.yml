  /MultiFactorAuthentication/Greeting:
    parameters:
      - $ref: common.yml#/components/parameters/XMsClientRequestId
      - $ref: '#/components/parameters/licenseKey'
    get:
      summary: List MFA greetings
      description: >-
        List MFA greetings.
      operationId: Mfa.Greetings.List
      tags: [Multi Factor Authentication]
      responses:
        '200':
          $ref: common.yml#/components/responses/UnknownResponse
        4XX:
          $ref: common.yml#/components/responses/ClientException
    post:
      summary: Create MFA greetings
      description: >-
        Create MFA greetings.
      operationId: Mfa.Greetings.Create
      tags: [Multi Factor Authentication]
      responses:
        '200':
          $ref: common.yml#/components/responses/UnknownResponse
        4XX:
          $ref: common.yml#/components/responses/ClientException
    delete:
      summary: Delete MFA greetings
      description: >-
        Delete MFA greetings.
      operationId: Mfa.Greetings.Delete
      tags: [Multi Factor Authentication]
      responses:
        '200':
          $ref: common.yml#/components/responses/UnknownResponse
        4XX:
          $ref: common.yml#/components/responses/ClientException
