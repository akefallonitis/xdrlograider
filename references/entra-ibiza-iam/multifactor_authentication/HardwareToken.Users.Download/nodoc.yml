  /MultiFactorAuthentication/HardwareToken/users/download:
    parameters:
      - $ref: common.yml#/components/parameters/XMsClientRequestId
    get:
      summary: Download hardware token user assignments
      description: >-
        Download hardware token user assignments.
      operationId: Mfa.HardwareToken.Users.Download
      tags: [Multi Factor Authentication]
      parameters:
        - name: upn
          description: The user principal name.
          in: query
          schema:
            $ref: common.yml#/components/schemas/userPrincipalName
        - name: enabledFilter
          description: Whether to filter for enabled results only.
          in: query
          schema:
            type: boolean
      responses:
        '200':
          $ref: common.yml#/components/responses/UnknownResponse
        4XX:
          $ref: common.yml#/components/responses/ClientException
