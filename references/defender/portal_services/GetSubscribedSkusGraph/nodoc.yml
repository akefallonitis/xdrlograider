  /msgraph/v1.0/subscribedSkus:
    get:
      summary: Get subscribed SKUs via Graph proxy
      description: >-
        Retrieve a list of subscribed SKUs (licenses) via the Microsoft Graph API proxy endpoint in the Defender XDR portal. Discovered on Identity Settings > About page.
      operationId: PortalServices.GetSubscribedSkusGraph
      tags: [Portal Services]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
