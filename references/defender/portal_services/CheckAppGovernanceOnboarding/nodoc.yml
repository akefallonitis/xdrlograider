  /m365appprotection/mapg-glsservice/compliance/istenantonboarded:
    get:
      summary: Check App Governance onboarding
      description: >-
        Check whether the tenant is onboarded to Microsoft 365 App Governance
        (App Protection).
      operationId: PortalServices.CheckAppGovernanceOnboarding
      tags: [Portal Services]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - App Governance onboarding status
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
