  /mtp/automation/internal/automation/{TenantId}/automationRules:
    get:
      summary: List automation rules
      description: >-
        Retrieve the automation rules displayed on the Defender XDR automation page for
        the current tenant.
      operationId: ActionCenter.ListAutomationRules
      tags: [Action Center]
      parameters:
        - name: TenantId
          in: path
          required: true
          description: The Microsoft Entra tenant identifier.
          schema:
            type: string
            format: uuid
        - name: pageSize
          in: query
          description: The number of automation rules to request.
          schema:
            type: integer
            default: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: pending - automation rule definition
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
