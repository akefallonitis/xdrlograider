  /mtp/CaseManagement/be/cases/{CaseId}/activities:
    get:
      summary: List case activities
      description: >-
        Retrieve the activity timeline for a Defender case detail view.
      operationId: ActionCenter.ListCaseActivities
      tags: [Action Center]
      parameters:
        - name: CaseId
          in: path
          required: true
          description: The Defender case identifier.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - case activities response
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
