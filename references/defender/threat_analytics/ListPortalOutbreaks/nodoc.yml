  /mtp/threatAnalytics/outbreaks:
    get:
      summary: List threat analytics report cards
      description: >-
        Retrieve the Threat Analytics report feed used by the Defender portal's
        newer report listing experience.
      operationId: ThreatAnalytics.ListPortalOutbreaks
      tags: [Threat Analytics]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - threat analytics report feed
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
