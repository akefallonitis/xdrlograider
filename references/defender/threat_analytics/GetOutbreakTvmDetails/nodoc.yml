  /mtp/threatAnalytics/outbreaks/v2/{OutbreakId}/tvmDetails:
    get:
      summary: Get outbreak TVM details
      description: >-
        Retrieve TVM detail data associated with a Threat Analytics report.
      operationId: ThreatAnalytics.GetOutbreakTvmDetails
      tags: [Threat Analytics]
      parameters:
        - name: OutbreakId
          in: path
          required: true
          description: The Threat Analytics outbreak identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - outbreak TVM details
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
