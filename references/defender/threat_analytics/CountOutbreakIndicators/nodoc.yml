  /mtp/threatAnalyticsIndicators/stix/outbreaks/{OutbreakId}/indicators/count:
    post:
      summary: Count outbreak indicators
      description: >-
        Retrieve the indicator count for the STIX indicators grid shown on a
        Threat Analytics report detail page.
      operationId: ThreatAnalytics.CountOutbreakIndicators
      tags: [Threat Analytics]
      parameters:
        - name: OutbreakId
          in: path
          required: true
          description: The Threat Analytics outbreak identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: pending - outbreak indicators count request
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - outbreak indicators count response
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
