  /mtp/threatAnalytics/outbreaks/v2/{OutbreakId}/incidentsAlertsSummary:
    get:
      summary: Get outbreak incidents and alerts summary
      description: >-
        Retrieve the incident and alert summary cards for a Threat Analytics report detail page.
      operationId: ThreatAnalytics.GetOutbreakIncidentsAlertsSummary
      tags: [Threat Analytics]
      parameters:
        - name: OutbreakId
          in: path
          required: true
          description: The Threat Analytics outbreak identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - incidents and alerts summary
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
