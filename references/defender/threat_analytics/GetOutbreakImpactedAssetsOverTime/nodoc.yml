  /mtp/threatAnalytics/outbreaks/v2/{OutbreakId}/impactedAssetsOvertime:
    get:
      summary: Get outbreak impacted assets over time
      description: >-
        Retrieve the impacted-assets-over-time chart shown in the Threat Analytics
        detail pivots.
      operationId: ThreatAnalytics.GetOutbreakImpactedAssetsOverTime
      tags: [Threat Analytics]
      parameters:
        - name: OutbreakId
          in: path
          required: true
          description: The Threat Analytics outbreak identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - impacted assets over time
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
