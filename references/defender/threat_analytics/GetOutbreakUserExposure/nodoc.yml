  /mtp/threatAnalytics/outbreaks/v2/{OutbreakId}/userExposure:
    get:
      summary: Get outbreak user exposure
      description: >-
        Retrieve user exposure details shown on the Threat Analytics report detail pivots.
      operationId: ThreatAnalytics.GetOutbreakUserExposure
      tags: [Threat Analytics]
      parameters:
        - name: OutbreakId
          in: path
          required: true
          description: The Threat Analytics outbreak identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - outbreak user exposure
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
