  /mtp/threatAnalytics/outbreaks/{OutbreakId}/alertsOvertimeSummary:
    get:
      summary: Get outbreak alerts over time summary
      description: >-
        Retrieve the alerts-over-time chart shown on a Threat Analytics report detail page.
      operationId: ThreatAnalytics.GetOutbreakAlertsOverTimeSummary
      tags: [Threat Analytics]
      parameters:
        - name: OutbreakId
          in: path
          required: true
          description: The Threat Analytics outbreak identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - outbreak alerts-over-time summary
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
