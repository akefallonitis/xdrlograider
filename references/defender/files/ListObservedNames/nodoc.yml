  /mtp/cloudPivot/cloud/pivot/portal/file/device/fileNamesBySha2:
    get:
      summary: List observed file names
      description: >-
        Return the file-name variants Defender observed for the SHA-256 over the selected
        time window.
      operationId: Files.ListObservedNames
      tags: [Files]
      parameters:
        - name: entityId
          in: query
          required: true
          description: The SHA-256 of the file.
          schema:
            type: string
        - name: daysToLookBack
          in: query
          description: The observation lookback window, in days.
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObservedNamesResponse'
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden
        '404':
          $ref: common.yml#/components/responses/NotFound
