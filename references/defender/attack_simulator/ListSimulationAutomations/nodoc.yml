  /astgws/AttackSimulator/api/v1/simulationAutomations:
    get:
      summary: List simulation automations
      description: >-
        Retrieve the automation rules and schedules shown by the Attack
        Simulator automation experience.
      operationId: AttackSimulator.ListSimulationAutomations
      tags: [AttackSimulator]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: pending - attack simulator automation definition
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
