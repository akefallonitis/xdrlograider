  /astgws/AttackSimulator/api/v1/GlobalPayloads:
    get:
      summary: List global payloads
      description: >-
        Retrieve the reusable payload catalog surfaced by the Attack Simulator
        training and simulation authoring experiences.
      operationId: AttackSimulator.ListGlobalPayloads
      tags: [AttackSimulator]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  description: pending - attack simulator global payload
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
