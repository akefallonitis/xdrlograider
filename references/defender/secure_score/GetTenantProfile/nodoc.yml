  /mtp/secureScore/security/secureScoreTenantProfile:
    get:
      summary: Get tenant secure score profile
      description: >-
        Retrieve the tenant's secure score profile, including configuration
        and benchmark comparisons.
      operationId: SecureScore.GetTenantProfile
      tags: [Secure Score]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - tenant secure score profile
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
