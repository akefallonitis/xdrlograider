  /mtp/settings/overrideMdeFlavor:
    get:
      summary: Get MDE flavor override
      description: >-
        Retrieve the tenant-specific Defender for Endpoint flavor override used
        by the Endpoints settings experience.
      operationId: EndpointConfiguration.GetMdeFlavorOverride
      tags: [Endpoint Configuration]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MdeFlavorOverride'
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
