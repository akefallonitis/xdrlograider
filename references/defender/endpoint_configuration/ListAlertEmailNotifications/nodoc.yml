  /mtp/alertsEmailNotifications/email_notifications:
    get:
      summary: List endpoint alert email notifications
      description: >-
        Retrieve the endpoint alert email-notification rules shown on the Endpoints
        settings > Email notifications experience. Live capture returned an empty
        items collection for the current tenant.
      operationId: EndpointConfiguration.ListAlertEmailNotifications
      tags: [Endpoint Configuration]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertEmailNotificationListResponse'
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
