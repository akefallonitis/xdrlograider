  /mtoapi/tenants/TenantPicker:
    get:
      summary: Get MTO tenant picker
      description: >-
        Retrieve the tenant picker payload used across the Defender multi-tenant
        management portal. Confirmed in live traffic from the MTO homepage,
        incidents, hunting, identity inventory, and administration pages.
      operationId: MultiTenant.ListTenants
      tags: [Multi-Tenant]
      x-nodoc-operation-context:
        surface: Multi-tenant shell
        workflows:
          - Open the Defender multi-tenant homepage or switch MTO incidents, hunting, identity, or administration views.
        authProfile: defender-mto-tenant-context
        availability:
          level: user-context
          notes:
            - Returned tenant choices and the effective selection depend on the signed-in operator and available MTO scope.
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Confirmed in live traffic from the MTO homepage, incidents, hunting, identity inventory, and administration pages.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPickerResponse'
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
