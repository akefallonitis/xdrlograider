  /mtp/ndr/machines/allWindowsReleaseVersions:
    get:
      summary: Get all Windows release versions
      description: >-
        Retrieve a list of all unique Windows release versions across the device inventory.
      operationId: EndpointDevices.GetAllWindowsReleaseVersions
      tags: [Endpoint Devices]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - all Windows release versions
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
