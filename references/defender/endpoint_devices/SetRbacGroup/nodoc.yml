  /mtp/rbacGroupAssignment/updateMachineRbacGroupAssignments:
    post:
      summary: Set device RBAC group
      description: >-
        Update the RBAC (Role-Based Access Control) group assignment for an endpoint device.
      operationId: EndpointDevices.SetRbacGroup
      tags: [Endpoint Devices]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                machineId:
                  description: The unique identifier of the device.
                  type: string
                rbacGroupId:
                  description: The RBAC group ID to assign.
                  type: string
              required:
                - machineId
                - rbacGroupId
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
