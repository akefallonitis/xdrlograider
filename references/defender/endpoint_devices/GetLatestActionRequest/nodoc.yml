  /mtp/responseApiPortal/requests/latest:
    get:
      summary: Get latest device response action
      description: >-
        Retrieve the most recent response action request for the selected device.
      operationId: EndpointDevices.GetLatestActionRequest
      tags: [Endpoint Devices]
      parameters:
        - name: machineId
          in: query
          required: true
          description: The Defender machine identifier.
          schema:
            type: string
        - name: tenantIds
          in: query
          description: Optional cross-tenant context. The portal currently sends an empty value.
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - latest device action request
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
