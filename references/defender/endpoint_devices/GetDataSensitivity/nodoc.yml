  /mtp/getDataSensitivity/machines/{MachineId}/dataSensitivity:
    get:
      summary: Get machine data sensitivity
      description: >-
        Retrieve the data-sensitivity projection for the selected device from the unified
        device overview experience.
      operationId: EndpointDevices.GetDataSensitivity
      tags: [Endpoint Devices]
      parameters:
        - name: MachineId
          in: path
          required: true
          description: The Defender machine identifier.
          schema:
            type: string
        - name: id
          in: query
          description: Duplicate machine identifier currently sent by the portal.
          schema:
            type: string
        - name: tenantIds
          in: query
          description: Optional cross-tenant context. The portal currently sends an empty value.
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - machine data sensitivity response
        '204':
          description: No Content
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
