  /mtp/getMachineMarkedEvents/machines/{MachineId}/eventMarks:
    get:
      summary: Get machine marked events
      description: >-
        Retrieve the marked device timeline events shown on the unified device page.
      operationId: EndpointDevices.GetMachineMarkedEvents
      tags: [Endpoint Devices]
      parameters:
        - name: MachineId
          in: path
          required: true
          description: The Defender machine identifier.
          schema:
            type: string
        - name: machineId
          in: query
          description: Duplicate machine identifier currently sent by the portal.
          schema:
            type: string
        - name: senseMachineId
          in: query
          description: The Sense machine identifier for the same device.
          schema:
            type: string
        - name: computerDnsName
          in: query
          description: The current DNS name of the device.
          schema:
            type: string
        - name: tenantIds
          in: query
          description: Optional cross-tenant context. The portal currently sends an empty value.
          schema:
            type: string
            nullable: true
        - name: armId
          in: query
          description: Optional Azure resource ID context for the device.
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Items:
                    type: array
                    items:
                      type: object
                      description: pending - marked event entry
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
