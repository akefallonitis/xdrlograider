  /mtp/responseApiPortal/requests/machine/any:
    get:
      summary: Check for any device response actions
      description: >-
        Check whether the selected device currently has any response action requests.
      operationId: EndpointDevices.HasAnyActionRequests
      tags: [Endpoint Devices]
      parameters:
        - name: machineId
          in: query
          required: true
          description: The Defender machine identifier.
          schema:
            type: string
        - name: tenantIds
          in: query
          description: Optional cross-tenant context. The portal currently sends an empty value.
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - device action existence state
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
