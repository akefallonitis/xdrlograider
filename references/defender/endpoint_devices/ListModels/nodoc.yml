  /mtp/deviceManagement/deviceModels:
    get:
      summary: List device models
      description: >-
        Retrieve a list of all device models found across the endpoint device inventory.
      operationId: EndpointDevices.ListModels
      tags: [Endpoint Devices]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
