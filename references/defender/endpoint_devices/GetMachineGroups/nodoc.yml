  /mtp/rbacManagementApi/rbac/machine_groups:
    get:
      summary: Get machine groups (RBAC)
      description: >-
        Retrieve the list of RBAC machine groups configured in the tenant.
      operationId: EndpointDevices.GetMachineGroups
      tags: [Endpoint Devices]
      parameters:
        - name: addAadGroupNames
          in: query
          description: Include Azure AD group names in results.
          schema:
            type: boolean
        - name: addMachineGroupCount
          in: query
          description: Include machine count per group.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - RBAC machine groups
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
