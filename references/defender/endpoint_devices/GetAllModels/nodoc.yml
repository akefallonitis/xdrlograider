  /mtp/ndr/machines/allModels:
    get:
      summary: Get all device models
      description: >-
        Retrieve a list of all unique device models across the device inventory.
      operationId: EndpointDevices.GetAllModels
      tags: [Endpoint Devices]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - all device models
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
