  /mtp/machineTag/machineTag:
    patch:
      summary: Set device tag
      description: >-
        Add or remove a tag on an endpoint device.
      operationId: EndpointDevices.SetTag
      tags: [Endpoint Devices]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                machineId:
                  description: The unique identifier of the device.
                  type: string
                tag:
                  description: The tag value to set.
                  type: string
                action:
                  description: The action to perform.
                  type: string
                  enum: [Add, Remove]
              required:
                - machineId
                - tag
                - action
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
