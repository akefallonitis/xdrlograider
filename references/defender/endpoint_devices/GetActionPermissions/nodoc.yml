  /mtp/responseApiPortal/requests/permissions:
    get:
      summary: Get device response action permissions
      description: >-
        Retrieve the action-permission matrix used to enable or disable device-response
        actions on the unified device page.
      operationId: EndpointDevices.GetActionPermissions
      tags: [Endpoint Devices]
      parameters:
        - name: machineId
          in: query
          required: true
          description: The Defender machine identifier.
          schema:
            type: string
        - name: tenantIds
          in: query
          description: Optional cross-tenant context. The portal currently sends an empty value.
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - device response action permissions
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
