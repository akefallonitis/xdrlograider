  /mtp/ndr/machines/allMachinesTags:
    get:
      summary: Get all machine tags
      description: >-
        Retrieve a list of all unique tags assigned to machines in the device inventory.
      operationId: EndpointDevices.GetAllMachineTags
      tags: [Endpoint Devices]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - all machine tags
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
