  /mtp/ndr/machines/machineTags:
    get:
      summary: Get NDR machine tags
      description: >-
        Retrieve the machine tags available to NDR inventory filters, including
        device-page lookups for the current machine.
      operationId: EndpointDevices.GetNdrMachineTags
      tags: [Endpoint Devices]
      parameters:
        - name: senseMachineId
          in: query
          description: Optional machine identifier for device-scoped tag lookups.
          schema:
            type: string
        - name: tenantIds
          in: query
          description: Optional cross-tenant context. The portal currently sends an empty value.
          schema:
            type: string
            nullable: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - NDR machine tags
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
