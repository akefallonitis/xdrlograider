  /mtp/alertsApiService/Evidences/device/Alerts:
    get:
      summary: List device alert evidences
      description: >-
        Retrieve the alert list shown on the unified device page's alert evidence pane.
      operationId: EndpointDevices.ListAlertEvidences
      tags: [Endpoint Devices]
      parameters:
        - name: status
          in: query
          description: Alert status filter applied by the device page.
          schema:
            type: integer
            default: 6
        - name: WcdMachineId
          in: query
          required: true
          description: The device identifier used by the device evidence experience.
          schema:
            type: string
        - name: ComputerDnsName
          in: query
          description: The current DNS name of the device.
          schema:
            type: string
        - name: MachineId
          in: query
          required: true
          description: The Defender machine identifier.
          schema:
            type: string
        - name: tenantIds
          in: query
          description: Optional cross-tenant context. The portal currently sends an empty value.
          schema:
            type: string
            nullable: true
        - name: lookBackInDays
          in: query
          description: Number of days of alert history to include.
          schema:
            type: integer
            default: 180
        - name: sortByField
          in: query
          description: The field used to sort the device alerts grid.
          schema:
            type: string
            default: severity
        - name: sortOrder
          in: query
          description: Sort direction for the alert grid.
          schema:
            type: string
            enum: [Ascending, Descending]
            default: Descending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - device alert evidence list
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
