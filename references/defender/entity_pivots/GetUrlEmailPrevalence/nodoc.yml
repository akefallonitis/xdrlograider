  /mtp/cloudPivot/cloud/pivot/portal/url/email/prevalence:
    get:
      summary: Get URL email prevalence
      description: Return the URL email prevalence summary.
      operationId: EntityPivots.GetUrlEmailPrevalence
      tags: [Entity Pivots]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/DaysToLookBack30'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityPivotPrevalenceResponse'
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden
        '404':
          $ref: common.yml#/components/responses/NotFound
