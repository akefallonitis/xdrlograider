  /mtp/cloudPivot/cloud/pivot/portal/domain/device/prevalence:
    get:
      summary: Get domain device prevalence
      description: >-
        Return the first and last observed device summary for the selected
        domain.
      operationId: EntityPivots.GetDomainDevicePrevalence
      tags: [Entity Pivots]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/DaysToLookBack30'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityPivotPrevalenceResponse'
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden
        '404':
          $ref: common.yml#/components/responses/NotFound
