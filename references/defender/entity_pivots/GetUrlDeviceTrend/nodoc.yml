  /mtp/cloudPivot/cloud/pivot/portal/url/device/trend:
    get:
      summary: Get URL device trend
      description: Return the URL device trend chart.
      operationId: EntityPivots.GetUrlDeviceTrend
      tags: [Entity Pivots]
      parameters:
        - $ref: '#/components/parameters/EntityId'
        - $ref: '#/components/parameters/DaysToLookBack30'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityPivotTrendResponse'
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden
        '404':
          $ref: common.yml#/components/responses/NotFound
