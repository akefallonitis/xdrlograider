  /mcas/cas/api/services:
    get:
      summary: List cloud app services
      description: >-
        Retrieve a list of cloud app services. Discovered on Activity Log page.
      operationId: CloudApps.ListServices
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/CloudAppsServiceCatalogResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
