  /mcas/cas/api/v1/connected_services/instances:
    get:
      summary: List connected service instances
      description: >-
        Retrieve a list of connected service instances. Discovered on Identity Settings > SaaS page.
      operationId: CloudApps.ListConnectedServiceInstances
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/CloudAppsConnectedServiceListResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
