  /mcas/cas/api/v1/discovery/top_apps:
    get:
      summary: Get top discovered apps
      description: >-
        Retrieve the top discovered apps for the selected Cloud Discovery
        stream and timeframe. Discovered during the Defender for Cloud Apps
        full-nav capture.
      operationId: CloudApps.GetDiscoveryTopApps
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
