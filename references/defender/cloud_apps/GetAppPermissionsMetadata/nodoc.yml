  /mcas/cas/api/v1/app_permissions/metadata:
    get:
      summary: Get app permissions metadata
      description: >-
        Retrieve metadata for the app permissions endpoint including filter definitions. Discovered on OAuth Apps page.
      operationId: CloudApps.GetAppPermissionsMetadata
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
