  /mcas/cas/api/v1/discovery/categories:
    get:
      summary: List discovery categories
      description: >-
        Retrieve a list of cloud app discovery categories. Discovered on Identity Settings > SaaS page.
      operationId: CloudApps.ListDiscoveryCategories
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
