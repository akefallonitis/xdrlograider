  /mcas/cas/api/v1/discovery/category_stats:
    get:
      summary: Get discovery category stats
      description: >-
        Retrieve category-level Cloud Discovery metrics for the selected stream
        and timeframe. Discovered during the Defender for Cloud Apps full-nav
        capture.
      operationId: CloudApps.GetDiscoveryCategoryStats
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
