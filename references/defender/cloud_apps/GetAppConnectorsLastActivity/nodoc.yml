  /mcas/cas/api/v1/app_connectors/last_activity:
    get:
      summary: Get app connectors last activity
      description: >-
        Retrieve last activity timestamps for app connectors. Discovered on Identity Settings > SaaS page.
      operationId: CloudApps.GetAppConnectorsLastActivity
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
