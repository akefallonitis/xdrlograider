  /mcas/cas/api/v1/discovery/top_categories:
    get:
      summary: Get top discovery categories
      description: >-
        Retrieve the top Cloud Discovery categories for the selected stream and
        timeframe. Discovered during the Defender for Cloud Apps full-nav
        capture.
      operationId: CloudApps.GetDiscoveryTopCategories
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
