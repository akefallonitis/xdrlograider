  /m365appprotection/mapg-glsservice/compliance/policyinsights:
    get:
      summary: Get App Governance policy insights
      description: >-
        Retrieve the insight cards and metrics shown for App Governance policies
        in the Defender portal.
      operationId: AppGovernance.GetPolicyInsights
      tags: [AppGovernance]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - App Governance policy insights
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
