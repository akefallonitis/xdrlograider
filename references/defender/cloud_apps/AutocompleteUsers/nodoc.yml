  /mcas/cas/api/v1/autocomplete/users:
    get:
      summary: Autocomplete users
      description: >-
        Retrieve autocomplete suggestions for users and user-like entities. The
        observed tenant returned an empty record set.
      operationId: CloudApps.AutocompleteUsers
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/CloudAppsAutocompleteResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
