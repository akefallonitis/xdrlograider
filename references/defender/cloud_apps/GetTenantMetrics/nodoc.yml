  /m365appprotection/mapg-glsservice/compliance/tenantmetrics:
    get:
      summary: Get App Governance tenant metrics
      description: >-
        Retrieve tenant-level App Governance metrics shown on the Defender portal's
        compliance overview.
      operationId: AppGovernance.GetTenantMetrics
      tags: [AppGovernance]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - tenant metrics
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
