  /mcas/cas/api/v1/autocomplete/scoped_profiles:
    get:
      summary: Autocomplete scoped profiles
      description: >-
        Retrieve autocomplete suggestions for scoped profiles used by Defender
        for Cloud Apps. Discovered during the Defender for Cloud Apps full-nav
        capture.
      operationId: CloudApps.AutocompleteScopedProfiles
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/CloudAppsAutocompleteResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
