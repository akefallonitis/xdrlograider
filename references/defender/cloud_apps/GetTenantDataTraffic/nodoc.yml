  /m365appprotection/mapg-glsservice/compliance/tenantdatatraffic:
    get:
      summary: Get App Governance tenant data traffic
      description: >-
        Retrieve tenant data-traffic metrics shown by the App Governance
        compliance dashboards in the Defender portal.
      operationId: AppGovernance.GetTenantDataTraffic
      tags: [AppGovernance]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - tenant data traffic
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
