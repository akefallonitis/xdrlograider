  /mcas/cas/api/v1/subnet/metadata:
    get:
      summary: Get subnet metadata
      description: >-
        Retrieve filter and sorting metadata for the IP address ranges grid in Defender
        for Cloud Apps.
      operationId: CloudApps.GetSubnetMetadata
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/CloudAppsMetadataCatalogResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
