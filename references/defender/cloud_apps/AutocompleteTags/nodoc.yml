  /mcas/cas/api/v1/autocomplete/tags:
    get:
      summary: Autocomplete tags
      description: >-
        Retrieve autocomplete suggestions for tag records in Defender for Cloud Apps.
      operationId: CloudApps.AutocompleteTags
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/CloudAppsAutocompleteResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
