  /mcas/cas/api/stories/get_stories_details:
    get:
      summary: Get story details
      description: >-
        Retrieve the details behind a Defender for Cloud Apps story card.
        Discovered during the Defender for Cloud Apps full-nav capture.
      operationId: CloudApps.GetStoryDetails
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
