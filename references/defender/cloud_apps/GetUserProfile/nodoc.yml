  /m365appprotection/mapg-glsservice/compliance/getUserProfile:
    get:
      summary: Get App Governance user profile
      description: >-
        Retrieve the current user's App Governance profile. Discovered on App Governance page.
      operationId: AppGovernance.GetUserProfile
      tags: [AppGovernance]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
