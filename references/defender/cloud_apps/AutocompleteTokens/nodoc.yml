  /mcas/cas/api/v1/autocomplete/tokens:
    get:
      summary: Autocomplete API tokens
      description: >-
        Retrieve autocomplete suggestions for token-like records. The observed tenant
        returned an empty record set.
      operationId: CloudApps.AutocompleteTokens
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/CloudAppsAutocompleteResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
