  /mcas/cas/api/v1/discovery/get_locations:
    get:
      summary: Search discovery locations
      description: >-
        Retrieve location suggestions for Cloud Discovery filtering. Discovered
        during the Defender for Cloud Apps full-nav capture.
      operationId: CloudApps.SearchDiscoveryLocations
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
