  /mcas/cas/api/v1/app_connectors/dashboard/get_supported_apps_metadata:
    get:
      summary: Get supported app connector metadata
      description: >-
        Retrieve metadata for supported connected apps shown in the app
        connectors dashboard. Discovered during the Defender for Cloud Apps
        full-nav capture.
      operationId: CloudApps.GetSupportedAppConnectorMetadata
      tags: [CloudApps]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
