  /m365appprotection/mapg-glsservice/compliance/policies:
    get:
      summary: List App Governance policies
      description: >-
        Retrieve the App Governance policy definitions displayed on the
        compliance and non-human identities policy surfaces.
      operationId: AppGovernance.ListPolicies
      tags: [AppGovernance]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - App Governance policies response
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
