  /radius/api/radius/identities/getTenantPartners:
    get:
      summary: Get Radius tenant partners
      description: >-
        Retrieve tenant partner metadata used by Radius-backed identity pages.
      operationId: Identity.GetRadiusTenantPartners
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - tenant partner metadata
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
