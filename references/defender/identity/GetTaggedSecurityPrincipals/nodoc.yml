  /aatp/odata/TaggedSecurityPrincipals:
    get:
      summary: Get tagged security principals (sensitive)
      description: >-
        Retrieve security principals tagged as sensitive using the OData endpoint. Discovered on Identity Settings > Sensitive page.
      operationId: Identity.GetTaggedSecurityPrincipals
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
