  /aatp/api/workspaces/isWorkspaceExists:
    get:
      summary: Check if workspace exists
      description: >-
        Check whether a Defender for Identity workspace exists for the tenant.
      operationId: Identity.CheckWorkspaceExists
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - workspace existence status
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
