  /mtp/siamApi/Onboarding:
    get:
      summary: Get SIAM onboarding summary
      description: >-
        Retrieve the Defender portal's onboarding summary for the identity attachment
        experience.
      operationId: Identity.GetOnboardingSummary
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  onboarded:
                    type: integer
                  notOnboarded:
                    type: integer
                  hasPermissions:
                    type: boolean
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
