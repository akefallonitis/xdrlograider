  /mdi/identity/identitiesapiservice/remediationAccount:
    get:
      summary: Get remediation action account
      description: >-
        Retrieve the remediation action account configuration used by
        Defender for Identity to perform automated remediation actions
        such as disabling compromised accounts.
      operationId: Identity.GetRemediationAccount
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationAccount'
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    post:
      summary: Create remediation action account
      description: >-
        Configure a new remediation action account for Defender for Identity.
      operationId: Identity.CreateRemediationAccount
      tags: [Identity]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationAccountCreate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationAccount'
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    put:
      summary: Update remediation action account
      description: >-
        Update the remediation action account configuration.
      operationId: Identity.UpdateRemediationAccount
      tags: [Identity]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemediationAccountCreate'
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
    delete:
      summary: Delete remediation action account
      description: >-
        Remove the remediation action account configuration.
      operationId: Identity.DeleteRemediationAccount
      tags: [Identity]
      responses:
        '200':
          description: OK
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
