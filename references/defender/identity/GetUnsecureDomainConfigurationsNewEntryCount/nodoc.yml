  /aatp/api/ispmReports/UnsecureDomainConfigurations/newEntryCount:
    get:
      summary: Get unsecure domain configuration delta
      description: >-
        Retrieve the count of newly surfaced insecure domain-configuration findings used
        by the Defender for Identity coverage and maturity dashboard.
      operationId: Identity.GetUnsecureDomainConfigurationsNewEntryCount
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  Count:
                    type: integer
                    description: Number of new insecure domain configuration entries.
                  IsCountExceeded:
                    type: boolean
                    description: Whether the result exceeded the service-side count ceiling.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
