  /aatp/api/workspace/configuration/syslog:
    get:
      summary: Get syslog configuration
      description: >-
        Retrieve the syslog notification configuration for Defender for Identity. Discovered on Identity Settings > Syslog notifications page.
      operationId: Identity.GetSyslogConfiguration
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
