  /aatp/odata/workspaceMonitoringAlerts:
    get:
      summary: Get workspace monitoring alerts
      description: >-
        Retrieve workspace monitoring alerts (health issues) using the OData endpoint. Discovered on Identity Settings > Health issues page.
      operationId: Identity.GetWorkspaceMonitoringAlerts
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
