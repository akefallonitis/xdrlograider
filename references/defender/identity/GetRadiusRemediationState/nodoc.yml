  /radius/api/radius/remediation/lmf/{Sid}:
    get:
      summary: Get Radius remediation state
      description: >-
        Retrieve the Radius remediation state for the supplied on-premises SID.
      operationId: Identity.GetRadiusRemediationState
      tags: [Identity]
      parameters:
        - name: Sid
          in: path
          required: true
          description: The on-premises SID for the identity.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - remediation state data
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
