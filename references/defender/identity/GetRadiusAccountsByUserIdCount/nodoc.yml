  /radius/api/radius/identities/accountsByUserIdCount:
    post:
      summary: Get Radius accounts count by user ID
      description: >-
        Retrieve the total number of Radius-linked accounts for the supplied
        identity ID.
      operationId: Identity.GetRadiusAccountsByUserIdCount
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                UserId:
                  type: string
                  description: The Radius or Defender identity ID to resolve.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - Radius accounts count
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
