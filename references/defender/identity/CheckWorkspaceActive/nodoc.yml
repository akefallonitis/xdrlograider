  /aatp/api/workspace/isActive:
    get:
      summary: Check workspace active status
      description: >-
        Check whether the Defender for Identity workspace is active. Discovered on Identity Settings > Health issues page.
      operationId: Identity.CheckWorkspaceActive
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
