  /mtp/siamApi/MachinesManagedByStatus:
    get:
      summary: Get SIAM managed-by status
      description: >-
        Retrieve the per-platform counts used by the Defender portal to show how attached
        machines are managed across MDE, MDM, SCCM, and unknown states.
      operationId: Identity.GetMachinesManagedByStatus
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    osFamily:
                      type: string
                    mde:
                      type: integer
                    mdm:
                      type: integer
                    sccm:
                      type: integer
                    unknown:
                      type: integer
                  additionalProperties: true
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
