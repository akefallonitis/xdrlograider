  /radius/api/radius/identities/getIdentityType:
    get:
      summary: Get Radius identity type
      description: >-
        Retrieve the Radius identity-type classification for the selected Entra
        ID.
      operationId: Identity.GetRadiusIdentityType
      tags: [Identity]
      parameters:
        - name: aadId
          in: query
          required: true
          description: The Microsoft Entra object ID for the identity.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - identity type classification
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
