  /radius/api/radius/identities/getDefenderRiskScoresOverTime:
    get:
      summary: Get Defender risk scores over time
      description: >-
        Retrieve the time-series risk scores for the selected identity.
      operationId: Identity.GetRadiusDefenderRiskScoresOverTime
      tags: [Identity]
      parameters:
        - name: identityId
          in: query
          required: true
          description: The Defender identity identifier.
          schema:
            type: string
        - name: startTime
          in: query
          description: The inclusive start of the requested time range.
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          description: The inclusive end of the requested time range.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - risk score time series
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
