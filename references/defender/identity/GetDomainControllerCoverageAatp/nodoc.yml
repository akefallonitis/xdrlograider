  /aatp/api/sensors/domainControllerCoverage:
    get:
      summary: Get domain controller coverage (AATP)
      description: >-
        Retrieve domain controller sensor coverage information from the
        AATP (Azure ATP) legacy API endpoint.
      operationId: Identity.GetDomainControllerCoverageAatp
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/DomainControllerCoverageResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
