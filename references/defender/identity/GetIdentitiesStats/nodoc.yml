  /mdi/identity/userapiservice/users/IdentitiesStats:
    post:
      summary: Get identity stats
      description: >-
        Retrieve the identity statistics card totals requested by the identities
        pages.
      operationId: Identity.GetIdentitiesStats
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                StatsType:
                  type: string
                  description: The named statistics set to retrieve.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - identity statistics
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
