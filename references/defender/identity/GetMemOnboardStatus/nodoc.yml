  /mtp/siamApi/memonboardstatus:
    get:
      summary: Get MEM onboarding status
      description: >-
        Retrieve whether the Defender portal considers Microsoft Endpoint Manager
        onboarding complete for the current tenant.
      operationId: Identity.GetMemOnboardStatus
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  isOnboarded:
                    type: boolean
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
