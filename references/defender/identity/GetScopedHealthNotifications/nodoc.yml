  /aatp/api/workspace/configuration/scopedHealthNotifications:
    get:
      summary: Get scoped health notifications
      description: >-
        Retrieve scoped health notification configuration for the workspace. Discovered on Identity Settings > Health issues notifications page.
      operationId: Identity.GetScopedHealthNotifications
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
