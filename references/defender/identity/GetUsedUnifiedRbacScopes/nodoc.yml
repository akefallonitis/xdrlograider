  /aatp/api/unifiedrbac/usedScopes:
    get:
      summary: Get used unified RBAC scopes
      description: >-
        Retrieve the unified RBAC scopes currently in use. Discovered on Identity Settings > Health issues notifications page.
      operationId: Identity.GetUsedUnifiedRbacScopes
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
