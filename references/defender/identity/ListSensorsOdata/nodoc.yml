  /aatp/odata/sensors:
    get:
      summary: List sensors (OData)
      description: >-
        Retrieve a list of Defender for Identity sensors using the OData endpoint.
      operationId: Identity.ListSensorsOdata
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - OData sensors list
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
