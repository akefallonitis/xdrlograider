  /mdi/identity/userapiservice/pdProtection/reportDefinitions/ExposedPasswords:
    get:
      summary: Get exposed-password report definitions
      description: >-
        Retrieve the password-protection report definitions used by the Defender portal's
        Exposed Passwords view.
      operationId: Identity.GetExposedPasswordReportDefinitions
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ActiveDirectory:
                    type: object
                    additionalProperties:
                      type: string
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
