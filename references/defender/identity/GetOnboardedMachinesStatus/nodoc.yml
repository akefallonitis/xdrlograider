  /mtp/siamApi/OnboardedMachinesStatus:
    get:
      summary: Get onboarded machines status
      description: >-
        Retrieve the onboarding counters and per-OS breakdown shown by the Defender
        portal's identity attachment experience.
      operationId: Identity.GetOnboardedMachinesStatus
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mdeOsFamilyOnboardedMachines:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                additionalProperties: true
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
