  /mdi/identity/userapiservice/serviceAccounts/count:
    get:
      summary: Get service accounts count
      description: >-
        Retrieve the total number of service accounts shown in the grid.
      operationId: Identity.GetServiceAccountsCount
      tags: [Identity]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - service accounts count
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
