  /mdi/identity/userapiservice/identities/count:
    post:
      summary: Get identities count
      description: >-
        Retrieve the total number of identities matching the supplied filters.
      operationId: Identity.GetIdentitiesCount
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                Filters:
                  type: object
                  description: Identity filter set.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - identities count
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
