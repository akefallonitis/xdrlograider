  /mtp/licenses/mgmt/aadlicenses/sums:
    get:
      summary: Get license sums
      description: >-
        Retrieve the aggregated Entra license counts used by Defender portal
        licensing checks.
      operationId: Configuration.GetLicenseSums
      tags: [Configuration]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - license sums
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
