  /mtp/sccManagement/mgmt/ServicesUrls:
    get:
      summary: Get Defender service URLs
      description: >-
        Retrieve the backend service URL map used by the Defender portal's
        configuration experiences.
      operationId: Configuration.GetServiceUrls
      tags: [Configuration]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ServiceUrls:
                    type: object
                    additionalProperties:
                      type: string
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
