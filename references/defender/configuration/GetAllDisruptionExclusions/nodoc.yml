  /mtp/disrupt/api/exclusions/exclude-all:
    get:
      summary: Get all disruption exclusions
      description: >-
        Retrieve the aggregate disruption exclusion settings shown by the
        disruption exclusion experience.
      operationId: Configuration.GetAllDisruptionExclusions
      tags: [Configuration]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - disruption exclusion settings
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
