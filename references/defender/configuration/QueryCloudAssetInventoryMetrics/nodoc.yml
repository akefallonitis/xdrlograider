  /mdc/views/inventory/metrics:
    post:
      summary: Query cloud asset inventory metrics
      description: >-
        Retrieve the aggregate metrics tiles shown above the Defender for Cloud asset
        inventory table.
      operationId: Configuration.QueryCloudAssetInventoryMetrics
      tags: [Configuration]
      parameters:
        - name: c
          in: query
          description: Portal locale sent by the Defender client.
          schema:
            type: string
        - name: v
          in: query
          description: Portal build version sent by the Defender client.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                schemaId:
                  type: string
                aggregatedColumns:
                  type: array
                  items:
                    type: object
                    description: pending - requested aggregation
                schemaParameters:
                  type: object
                  additionalProperties: true
                filters:
                  type: array
                  items:
                    type: object
                    description: pending - metrics filter
              required:
                - schemaId
                - aggregatedColumns
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Defender for Cloud inventory aggregation response.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
