  /mtp/licenses/mgmt/aadlicenses/mdc/status:
    get:
      summary: Get MDC license status
      description: >-
        Retrieve the Microsoft Defender for Cloud licensing status surfaced by the
        Defender portal's licensing helpers.
      operationId: Configuration.GetMdcLicenseStatus
      tags: [Configuration]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - MDC license status
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
