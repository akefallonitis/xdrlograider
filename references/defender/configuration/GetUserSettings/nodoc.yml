  /mtp/settings/GetUserSettings:
    get:
      summary: Get Defender XDR user settings
      description: >-
        Retrieve tenant-level Defender XDR user settings such as regional context,
        retention bounds, and industry-specific configuration flags.
      operationId: Configuration.GetUserSettings
      tags: [Configuration]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
