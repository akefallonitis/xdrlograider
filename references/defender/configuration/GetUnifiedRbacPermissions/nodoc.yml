  /mtp/urbacConfiguration/gw/unifiedrbac/configuration/permissions:
    get:
      summary: Get unified RBAC permissions
      description: >-
        Retrieve the unified RBAC permissions catalog displayed on the Defender
        security permissions page.
      operationId: Configuration.GetUnifiedRbacPermissions
      tags: [Configuration]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - unified RBAC permissions catalog
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
