  /mtp/webThreatProtection/WebContentFiltering/Reports/TopParentCategories:
    get:
      summary: Get top web content filtering categories
      description: >-
        Retrieve the top parent categories shown in the Defender portal's web content
        filtering report experience.
      operationId: Configuration.GetTopWebContentFilteringCategories
      tags: [Configuration]
      parameters:
        - name: includeActivityChange
          in: query
          description: Whether to include activity change deltas in the report response.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  UpdateTime:
                    type: string
                    format: date-time
                  TopParentCategories:
                    type: array
                    items:
                      type: object
                      properties:
                        Name:
                          type: string
                        ActivityDeltaPercentage:
                          type: number
                          format: double
                        IsDeltaPercentageValid:
                          type: boolean
                        TotalAccessRequests:
                          type: integer
                        TotalBlockedCount:
                          type: integer
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
