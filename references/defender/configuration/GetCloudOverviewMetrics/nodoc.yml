  /mdc/views/overview/overviewMetrics:
    post:
      summary: Get cloud overview metrics
      description: >-
        Retrieve the Defender for Cloud overview metrics payload used by the overview page.
      operationId: Configuration.GetCloudOverviewMetrics
      tags: [Configuration]
      parameters:
        - name: c
          in: query
          description: Portal locale sent by the Defender client.
          schema:
            type: string
        - name: v
          in: query
          description: Portal build version sent by the Defender client.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                startDateTime:
                  type: string
                  format: date-time
                  description: Start time for the overview metric window.
              required:
                - startDateTime
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Defender for Cloud overview metrics response.
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
