  /mtp/wdatpApi/dataexportsettings:
    get:
      summary: Get raw data export settings
      description: >-
        Retrieve Defender raw data export settings, including attached Log Analytics
        workspace targets and enabled export categories.
      operationId: Configuration.GetDataExportSettings
      tags: [Configuration]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - raw data export settings
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
