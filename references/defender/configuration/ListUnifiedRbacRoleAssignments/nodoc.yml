  /mtp/urbacConfiguration/gw/unifiedrbac/configuration/roleDefinitions/{RoleDefinitionId}/roleAssignments:
    get:
      summary: List unified RBAC role assignments
      description: >-
        Retrieve the role assignments for a selected unified RBAC role definition
        from the Defender security permissions detail page.
      operationId: Configuration.ListUnifiedRbacRoleAssignments
      tags: [Configuration]
      parameters:
        - name: RoleDefinitionId
          in: path
          required: true
          description: The unified RBAC role definition identifier.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - unified RBAC role assignments response
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
