  /Skype.Ncs/civicAddresses/filters:
    servers:
      - url: https://api.interfaces.records.teams.microsoft.com
        description: Teams interfaces records service
    get:
      tags: [InterfacesRecords]
      summary: List civic address filters
      description: |
        Returns Teams emergency calling civic address filters for the current tenant.
      parameters:
        - $ref: '#/components/parameters/Count'
        - $ref: '#/components/parameters/ResultSize'
        - $ref: '#/components/parameters/PopulateNumberOfVoiceUsers'
        - $ref: '#/components/parameters/PopulateNumberOfTelephoneNumbers'
      x-nodoc-operation-context:
        surface: Voice > Emergency addresses
        workflows:
          - Open Teams emergency calling address management and request filter values for the current tenant.
        headerProfile: teams-service-bearer
        variants:
          - location: query
            selector: Count
            notes: Controls how many available filter values the service considers before trimming the result set.
          - location: query
            selector: ResultSize
            notes: Controls how many filter rows the service returns.
          - location: query
            selector: PopulateNumberOfVoiceUsers
            notes: Requests the companion voice-user counts for each civic address filter.
          - location: query
            selector: PopulateNumberOfTelephoneNumbers
            notes: Requests the companion telephone-number counts for each civic address filter.
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Verified from authenticated Teams emergency-calling administration pages.
      responses:
        '200':
          description: Civic address filter collection.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GenericArrayItem'
        '401':
          $ref: '#/components/responses/Unauthorized'