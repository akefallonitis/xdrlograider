  /api/mt/part/{partition}/beta/users/tenantWideAppsSettings:
    servers:
      - url: https://teams.microsoft.com
        description: Teams core service host
    get:
      tags: [TeamsCore]
      summary: Get tenant-wide Teams apps settings
      description: |
        Tenant-wide apps settings read observed alongside Teams app catalog and app access request
        detail pages.
      parameters:
        - $ref: '#/components/parameters/Partition'
      responses:
        '200':
          description: Tenant-wide apps settings payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'