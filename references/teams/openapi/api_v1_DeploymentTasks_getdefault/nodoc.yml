  /api/v1/DeploymentTasks/getdefault:
    servers:
      - url: https://noneu-admin.teams.microsoft.com
        description: Regional Teams admin service
    get:
      tags: [RegionalAdmin]
      summary: Get default Teams deployment tasks
      description: |
        Deployment task defaults observed from Teams planning pages.
      responses:
        '200':
          description: Deployment task default payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'