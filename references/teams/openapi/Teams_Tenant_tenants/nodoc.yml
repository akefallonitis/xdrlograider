  /Teams.Tenant/tenants:
    servers:
      - url: https://api.interfaces.records.teams.microsoft.com
        description: Teams interfaces records service
    get:
      tags: [InterfacesRecords]
      summary: Get the current Teams tenant record
      description: |
        Tenant-scoped Teams record used by the admin center to understand assigned service plans and
        feature state across the current tenant.
      responses:
        '200':
          description: Tenant record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsTenantRecord'
        '401':
          $ref: '#/components/responses/Unauthorized'