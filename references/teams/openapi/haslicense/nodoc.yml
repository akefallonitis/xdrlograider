  /haslicense:
    servers:
      - url: https://amer.vamonetization.teams.microsoft.com
        description: Regional virtual appointments monetization backend
    get:
      tags: [RegionalVAMonetization]
      summary: Check monetization license state
      description: |
        Boolean license check used by virtual appointments and SMS-related Teams admin experiences.
      parameters:
        - $ref: '#/components/parameters/AppId'
      responses:
        '200':
          description: License state.
          content:
            application/json:
              schema:
                type: boolean
                example: false
        '401':
          $ref: '#/components/responses/Unauthorized'