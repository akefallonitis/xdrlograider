  /api/mt/part/{partition}/beta/admin/deviceStoreSetting:
    servers:
      - url: https://teams.microsoft.com
        description: Teams core service host
    get:
      tags: [TeamsCore]
      summary: Get Teams device store settings
      description: |
        Device store configuration read used by the Teams devices admin experience.
      parameters:
        - $ref: '#/components/parameters/Partition'
      responses:
        '200':
          description: Device store settings payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'