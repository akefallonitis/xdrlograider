  /Skype.TelephoneNumberMgmt/tenants/{tenantId}/port-out-pin:
    servers:
      - url: https://api.interfaces.records.teams.microsoft.com
        description: Teams interfaces records service
    get:
      tags: [TeamsTelephony]
      summary: Get the tenant port-out PIN
      description: |
        Tenant port-out PIN lookup observed from Teams voice number-management pages.
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Port-out PIN payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'