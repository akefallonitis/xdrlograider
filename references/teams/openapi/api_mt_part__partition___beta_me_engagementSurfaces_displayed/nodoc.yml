  /api/mt/part/{partition}//beta/me/engagementSurfaces/displayed:
    servers:
      - url: https://teams.microsoft.com
        description: Teams core service host
    put:
      tags: [TeamsCore]
      summary: Mark an admin engagement surface as displayed
      description: |
        Write observed when the Teams admin center acknowledged that a coaching or engagement surface
        had been shown to the current admin.
      parameters:
        - $ref: '#/components/parameters/Partition'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Engagement state acknowledgement result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'