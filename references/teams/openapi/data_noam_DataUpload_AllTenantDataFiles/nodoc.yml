  /data/noam/DataUpload/AllTenantDataFiles:
    servers:
      - url: https://cqd.teams.cloud.microsoft
        description: Regional CQD data host
    get:
      tags: [TeamsCQDData]
      summary: List CQD tenant data upload files
      description: |
        Regional CQD data route observed after the Teams admin center resolved the tenant-specific CQD
        data service host.
      responses:
        '200':
          description: CQD tenant data file payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'