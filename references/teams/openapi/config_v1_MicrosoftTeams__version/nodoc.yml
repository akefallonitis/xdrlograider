  /config/v1/MicrosoftTeams/{version}:
    servers:
      - url: https://config.teams.microsoft.com
        description: Teams config service
    get:
      tags: [TeamsConfig]
      summary: Get Microsoft Teams config payload
      description: |
        Config service read used by the admin center to retrieve Teams workload settings such as
        `TeamsClientMwtPackages`.
      parameters:
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/AgentsMicrosoftTeams'
        - $ref: '#/components/parameters/TenantIdUpperQuery'
      responses:
        '200':
          description: Config payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'