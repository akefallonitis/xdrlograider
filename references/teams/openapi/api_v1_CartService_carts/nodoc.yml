  /api/v1/CartService/carts:
    servers:
      - url: https://noneu-admin.teams.microsoft.com
        description: Regional Teams admin service
    post:
      tags: [RegionalAdmin]
      summary: Create a Teams add-on purchase cart
      description: |
        Cart-creation route observed from Teams add-on licensing surfaces. This should be treated as a
        real write.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: Cart creation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'