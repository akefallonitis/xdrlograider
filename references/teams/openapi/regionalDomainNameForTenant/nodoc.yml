  /regionalDomainNameForTenant:
    servers:
      - url: https://vamonetization.teams.microsoft.com
        description: Global virtual appointments monetization resolver
    get:
      tags: [VAMonetizationResolver]
      summary: Resolve the virtual appointments monetization regional host
      description: |
        Bootstrap endpoint that maps the current tenant to a regional monetization backend such as
        `amer.vamonetization.teams.microsoft.com`.
      responses:
        '200':
          description: Regional host resolver result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: string
                    example: amer.vamonetization.teams.microsoft.com
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'

  # amer.vamonetization.teams.microsoft.com