  /api/v1/DeploymentTeams:
    servers:
      - url: https://noneu-admin.teams.microsoft.com
        description: Regional Teams admin preference service
    get:
      tags: [RegionalAdmin]
      summary: Get deployment team records
      description: |
        Returns deployment-team records used by the Teams admin dashboard. The captured tenant returned
        `204 No Content`.
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'