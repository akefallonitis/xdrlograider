  /api/v1/Persona/GetAll:
    servers:
      - url: https://noneu-admin.teams.microsoft.com
        description: Regional Teams admin service
    get:
      tags: [RegionalAdmin]
      summary: List Teams admin personas
      description: |
        Persona inventory observed from planning and policy pages while the Teams admin shell resolved
        available experiences.
      responses:
        '200':
          description: Persona inventory payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # teams.microsoft.com/api