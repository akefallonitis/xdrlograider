  /api/mt/part/{partition}/beta/admin/tenantSharedChannelsSettings:
    servers:
      - url: https://teams.microsoft.com
        description: Teams core service host
    get:
      tags: [TeamsCore]
      summary: Get tenant shared channel settings
      description: |
        Shared channels configuration lookup observed from Teams app and collaboration administration
        surfaces.
      parameters:
        - $ref: '#/components/parameters/Partition'
      responses:
        '200':
          description: Shared channel settings payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'