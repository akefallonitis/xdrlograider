  /Realtime.Analytics/Users/{userId}/CommunicationsSummary/{lookbackDays}:
    servers:
      - url: https://api.interfaces.records.teams.microsoft.com
        description: Teams interfaces records service
    get:
      tags: [TeamsRealtimeAnalytics]
      summary: Get Teams user communications summary
      description: |
        Real-time communications summary observed while opening Teams user detail pages. The retained
        detail pass consistently used a seven-day interval.
      parameters:
        - $ref: '#/components/parameters/UserId'
        - $ref: '#/components/parameters/LookbackDays'
      responses:
        '200':
          description: Communications summary payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'