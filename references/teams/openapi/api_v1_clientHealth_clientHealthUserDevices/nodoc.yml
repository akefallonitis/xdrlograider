  /api/v1/clientHealth/clientHealthUserDevices:
    servers:
      - url: https://noneu-admin.teams.microsoft.com
        description: Regional Teams admin service
    get:
      tags: [RegionalAdmin]
      summary: List Teams client health user devices
      description: |
        User-device detail route observed from `Teams client health`. The retained crawl saw both
        successful `200` responses and a `500` response, suggesting some tenant or device slices can
        still fail server-side.
      responses:
        '200':
          description: Client health user-device payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'