  /Skype.TelephoneNumberMgmt/tenants/{tenantId}/country/{countryCode}/{briefType}:
    servers:
      - url: https://api.interfaces.records.teams.microsoft.com
        description: Teams interfaces records service
    get:
      tags: [TeamsTelephony]
      summary: Get country-specific Teams telephony briefs
      description: |
        Country-scoped tender and campaign brief routes observed while drilling into Teams voice
        provisioning pages.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CountryCode'
        - $ref: '#/components/parameters/BriefType'
      responses:
        '200':
          description: Country-specific telephony brief payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'