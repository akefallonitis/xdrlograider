  /api/mt/part/{partition}/beta/admin/getAgentSettingsForTAC:
    servers:
      - url: https://teams.microsoft.com
        description: Teams core service host
    get:
      tags: [TeamsCore]
      summary: Get Teams admin center agent settings
      description: |
        Portal settings read used by the Teams admin center shell while loading additional agent-backed
        surfaces.
      parameters:
        - $ref: '#/components/parameters/Partition'
      responses:
        '200':
          description: Agent settings payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'