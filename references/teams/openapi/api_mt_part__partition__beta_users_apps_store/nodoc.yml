  /api/mt/part/{partition}/beta/users/apps/store:
    servers:
      - url: https://teams.microsoft.com
        description: Teams core service host
    post:
      tags: [TeamsCore]
      summary: Query the Teams app store from the admin center
      description: |
        Search or filter request observed while drilling into Teams app detail pages and related store
        pivots.
      parameters:
        - $ref: '#/components/parameters/Partition'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericObject'
      responses:
        '200':
          description: App store query result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'