  /Skype.TelephoneNumberMgmt/Tenants/{tenantId}/telephone-number-aggregation:
    servers:
      - url: https://api.interfaces.records.teams.microsoft.com
        description: Teams interfaces records service
    get:
      tags: [TeamsTelephony]
      summary: Get tenant telephone number aggregation
      description: |
        Telephony aggregation used by Teams voice administration surfaces.
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Locale'
      responses:
        '200':
          description: Telephone number aggregation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelephoneNumberAggregationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'