  /AdminAppCatalog/teamsApps:
    servers:
      - url: https://substrate.office.com
        description: Teams app catalog backend
    get:
      tags: [AppCatalog]
      summary: List Teams app catalog entries
      description: |
        App catalog inventory read observed from the Teams admin dashboard.
      responses:
        '200':
          description: Teams app catalog entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsAppCatalogEntries'
        '401':
          $ref: '#/components/responses/Unauthorized'