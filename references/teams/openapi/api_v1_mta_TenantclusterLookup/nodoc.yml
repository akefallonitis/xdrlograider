  /api/v1/mta/TenantclusterLookup:
    servers:
      - url: https://monitoringplatform.teams.microsoft.com
        description: Teams monitoring platform bootstrap host
    get:
      tags: [MonitoringPlatform]
      summary: Resolve the monitoring platform cluster for the tenant
      description: |
        Monitoring bootstrap call observed across multiple Teams admin pages. The response returned an
        `mta` base URL such as `https://useast2.monitoringplatform.teams.microsoft.com`.
      responses:
        '200':
          description: Cluster lookup result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsClusterLookupResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'