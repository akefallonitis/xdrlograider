  /api/Flighting:
    get:
      tags: [Platform]
      summary: Get Autopatch feature flags
      description: |
        Returns Windows Autopatch feature flags and rollout toggles used across tenant
        administration blades. Confirmed live across every Windows Autopatch-related blade.
      x-nodoc-live-capture:
        source: "authenticated Intune admin center"
        browsedPages:
          - "https://intune.microsoft.com/#view/Microsoft_Intune_Enrollment/ReportingMenu/~/windowsQualityUpdatesReactView"
      operationId: IntuneAutopatch.Platform.GetFlighting
      responses:
        '200':
          description: Feature flags returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
