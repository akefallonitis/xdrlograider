  /reporting/reports/v2/windowsFeatureUpdates/details:
    post:
      tags: [Reporting]
      summary: List feature update device details
      description: |
        Returns the Windows feature update device-detail grid. The route was recovered from the
        report bundle and confirmed with a safe probe; this tenant returned an empty `values`
        array, so the field list here comes from the blade's response-mapping code. The bundle's
        default request uses an empty `sortKey`; an invalid summary-style sort key returned `422`
        during probing.
      operationId: IntuneAutopatch.Reporting.ListFeatureUpdateDetails
      parameters:
        - $ref: '#/components/parameters/reportApiVersion2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureUpdateDetailsRequest'
      responses:
        '200':
          description: Feature update device details returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureUpdateDetailsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
