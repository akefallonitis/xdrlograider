  /reporting/reports/v2/deviceAccounting/wqu/summary/businessgroups:
    post:
      tags: [Reporting]
      summary: List quality update business group summaries
      description: |
        Returns the baseline Windows quality update summary rows grouped by business group for
        `windowsQualityUpdatesReactView`. Confirmed live on the report blade's initial load.
      x-nodoc-live-capture:
        source: "authenticated Intune admin center"
        browsedPages:
          - "https://intune.microsoft.com/#view/Microsoft_Intune_Enrollment/ReportingMenu/~/windowsQualityUpdatesReactView"
      operationId: IntuneAutopatch.Reporting.ListQualityUpdateBusinessGroups
      parameters:
        - $ref: '#/components/parameters/reportApiVersion2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityUpdateSummaryBusinessGroupsRequest'
      responses:
        '200':
          description: Quality update business group summary returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityUpdateBusinessGroupSummaryResponse'
              example:
                values:
                  - businessGroupId: 11111111-1111-1111-1111-111111111111
                    businessGroupName: Windows Autopatch
                    policyId: ''
                    policyName: ''
                    businessGroupAltName: Windows Autopatch
                    uptoDateDevicesCount: 0
                    notuptodateDevicesCount: 0
                    inProgressDevicesCount: 0
                    pausedDevicesCount: 0
                    notReadyDevicesCount: 0
                    devicesCount: 0
                    completion: 0
                    updatedCompletion: 0
                    isBusinessGroupEnabled: 1
                    timestamp: '0001-01-01T00:00:00'
                    tenantId: 00000000-0000-0000-0000-000000000000
                totalRowCount: 1
                startRowIndex: 1
                endRowIndex: 1
                tenantId: 00000000-0000-0000-0000-000000000000
                activityId: 00000000-0000-0000-0000-000000000001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
