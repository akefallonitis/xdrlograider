  /reporting/reports/v2/windowsFeatureUpdates/summary/releases:
    post:
      tags: [Reporting]
      summary: List feature update release summaries
      description: |
        Returns the baseline Windows feature update summary rows grouped by release for
        `windowsFeatureUpdatesReactView`. Confirmed live on the report blade's initial load.
      operationId: IntuneAutopatch.Reporting.ListFeatureUpdateReleases
      parameters:
        - $ref: '#/components/parameters/reportApiVersion2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureUpdateSummaryReleasesRequest'
      responses:
        '200':
          description: Feature update release summary returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureUpdateReleaseSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
