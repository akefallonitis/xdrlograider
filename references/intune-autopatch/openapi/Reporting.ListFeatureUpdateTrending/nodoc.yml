  /reporting/reports/v2/windowsFeatureUpdates/trending:
    post:
      tags: [Reporting]
      summary: List feature update trend points
      description: |
        Returns Windows feature update trend buckets for durations such as `Trend30To0d`.
        Confirmed live on the report blade's initial load.
      operationId: IntuneAutopatch.Reporting.ListFeatureUpdateTrending
      parameters:
        - $ref: '#/components/parameters/reportApiVersion2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureUpdateTrendingRequest'
      responses:
        '200':
          description: Feature update trend rows returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureUpdateTrendingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
