  /reporting/reports/v2/windowsFeatureUpdates/summary/phases:
    post:
      tags: [Reporting]
      summary: List feature update phase summaries
      description: |
        Returns Windows feature update summary rows grouped by phase for a selected release. The
        route was recovered from the report bundle and confirmed with a safe probe using a live
        `releaseId` captured from the summary grid.
      operationId: IntuneAutopatch.Reporting.ListFeatureUpdatePhases
      parameters:
        - $ref: '#/components/parameters/reportApiVersion2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureUpdateSummaryPhasesRequest'
      responses:
        '200':
          description: Feature update phase summary returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureUpdatePhaseSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
