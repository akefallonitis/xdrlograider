  /support/odata/v1/supportRequests('{supportRequestId}')/Reactivate:
    post:
      tags: [Support]
      summary: Reactivate a support request
      description: |
        Reactivates a recently resolved Windows Autopatch support request. The path was recovered
        from the Support requests bundle. This write was not executed live in this pass.
      operationId: IntuneAutopatch.Support.ReactivateSupportRequest
      parameters:
        - $ref: '#/components/parameters/supportRequestId'
      responses:
        '200':
          description: Support request reactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '204':
          description: Support request reactivated successfully with no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
