  /access-control/v1/UserToken:
    get:
      tags: [Roles]
      summary: Get access-control user token context
      description: |
        Returns the caller's access-control token context, including directory role template IDs in
        `wids`. Confirmed live from the Tenant management route during a page reload.
      operationId: IntuneAutopatch.Roles.GetUserToken
      responses:
        '200':
          description: Access-control token context returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessControlUserToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
