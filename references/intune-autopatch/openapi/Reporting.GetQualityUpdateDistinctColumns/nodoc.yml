  /reporting/reports/v2/deviceAccounting/wqu/distinct/selectedColumns:
    post:
      tags: [Reporting]
      summary: Get quality update distinct filter values
      description: |
        Returns Windows quality update distinct-column values used to populate report filters.
        The route was recovered from the report bundle and confirmed with safe probes for both the
        default path and the optional `hotpatched=true` variant.
      operationId: IntuneAutopatch.Reporting.GetQualityUpdateDistinctColumns
      parameters:
        - $ref: '#/components/parameters/reportApiVersion2'
        - $ref: '#/components/parameters/includeHistoricalValue'
        - $ref: '#/components/parameters/hotpatched'
      responses:
        '200':
          description: Quality update distinct-column values returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityUpdateDistinctColumnsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
