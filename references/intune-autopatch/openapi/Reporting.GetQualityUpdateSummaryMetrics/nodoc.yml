  /reporting/reports/v2/deviceAccounting/wqu/summaryMetrics:
    post:
      tags: [Reporting]
      summary: Get quality update summary metrics
      description: |
        Returns Windows quality update count buckets used by the summary cards on
        `windowsQualityUpdatesReactView`. Confirmed live on the report blade's initial load.
      x-nodoc-live-capture:
        source: "authenticated Intune admin center"
        browsedPages:
          - "https://intune.microsoft.com/#view/Microsoft_Intune_Enrollment/ReportingMenu/~/windowsQualityUpdatesReactView"
      operationId: IntuneAutopatch.Reporting.GetQualityUpdateSummaryMetrics
      parameters:
        - $ref: '#/components/parameters/reportApiVersion2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityUpdateSummaryMetricsRequest'
      responses:
        '200':
          description: Quality update summary metrics returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityUpdateSummaryMetricsResponse'
              example:
                values: []
                totalRowCount: 0
                startRowIndex: 0
                endRowIndex: 0
                tenantId: 00000000-0000-0000-0000-000000000000
                activityId: 00000000-0000-0000-0000-000000000002
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
