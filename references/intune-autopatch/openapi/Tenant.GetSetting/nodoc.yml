  /tenant-management/v1/TenantSetting:
    get:
      tags: [Tenant]
      summary: Get a tenant setting
      description: |
        Returns a tenant-management setting by name and plan. This GET was confirmed live with
        `name=showDeviceUsageData&plan=Starter`, which returned `204 No Content` in this tenant.
      operationId: IntuneAutopatch.Tenant.GetSetting
      parameters:
        - $ref: '#/components/parameters/tenantSettingName'
        - name: plan
          in: query
          required: true
          description: Managed service plan identifier.
          schema:
            type: string
            example: Starter
      responses:
        '200':
          description: Tenant setting returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingState'
        '204':
          description: The tenant setting name was valid but no value was returned for this tenant.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Tenant]
      summary: Update a tenant setting
      description: |
        Updates a tenant-management setting. The Tenant management bundle augments the outgoing
        payload with `tenantId` before POSTing it to this path. This write was recovered from the
        Tenant management bundle and was not executed live in this pass.
      operationId: IntuneAutopatch.Tenant.UpdateSetting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSettingUpdateRequest'
      responses:
        '200':
          description: Tenant setting updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettingState'
        '204':
          description: Tenant setting updated successfully with no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'