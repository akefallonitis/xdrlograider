  /reporting/reports/v2/windowsFeatureUpdates/summaryMetrics:
    post:
      tags: [Reporting]
      summary: Get feature update summary metrics
      description: |
        Returns Windows feature update count buckets used by the summary cards on
        `windowsFeatureUpdatesReactView`. Confirmed live on the report blade's initial load.
      operationId: IntuneAutopatch.Reporting.GetFeatureUpdateSummaryMetrics
      parameters:
        - $ref: '#/components/parameters/reportApiVersion2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeatureUpdateSummaryMetricsRequest'
      responses:
        '200':
          description: Feature update summary metrics returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureUpdateSummaryMetricsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
