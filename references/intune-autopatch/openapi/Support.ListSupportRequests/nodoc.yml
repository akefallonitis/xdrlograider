  /support/odata/v1/supportRequests:
    get:
      tags: [Support]
      summary: List support requests
      description: |
        Returns Windows Autopatch support requests. Confirmed live with OData-style projection,
        filtering, paging, sorting, and count parameters.
      operationId: IntuneAutopatch.Support.ListSupportRequests
      parameters:
        - $ref: '#/components/parameters/select'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/top'
        - $ref: '#/components/parameters/skip'
        - $ref: '#/components/parameters/orderBy'
        - $ref: '#/components/parameters/count'
      responses:
        '200':
          description: Support requests returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataGenericCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Support]
      summary: Create a support request
      description: |
        Creates a Windows Autopatch support request. The request shape was recovered from the
        Support requests bundle, including the nested contact block and Autopatch-specific plan
        fields. This write was not executed live in this pass.
      operationId: IntuneAutopatch.Support.CreateSupportRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportRequestCreateRequest'
      responses:
        '200':
          description: Support request created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequestCreateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
