  /support/odata/v1/supportRequests('{supportRequestId}'):
    get:
      tags: [Support]
      summary: Get a support request
      description: |
        Returns a single Windows Autopatch support request by ID. The exact path was recovered from
        the Support requests bundle; a live GET was not exercised in this tenant because the list
        endpoint returned no requests to inspect.
      operationId: IntuneAutopatch.Support.GetSupportRequest
      parameters:
        - $ref: '#/components/parameters/supportRequestId'
      responses:
        '200':
          description: Support request returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Support]
      summary: Update a support request
      description: |
        Updates mutable fields on a Windows Autopatch support request. The bundle-recovered edit
        flow patches severity and business impact before issuing other support-request mutations.
        This write was not executed live in this pass.
      operationId: IntuneAutopatch.Support.UpdateSupportRequest
      parameters:
        - $ref: '#/components/parameters/supportRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportRequestUpdateRequest'
      responses:
        '200':
          description: Support request updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequest'
        '204':
          description: Support request updated successfully with no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
