  /unified-reporting/odata/1.0/AutopatchGroupMembershipRegistered:
    get:
      tags: [AutopatchGroups]
      summary: List registered Autopatch group memberships
      description: |
        Returns registered Windows Autopatch group membership reporting data. Confirmed live with
        `$count=true` on the Autopatch groups blade.
      operationId: IntuneAutopatch.AutopatchGroups.ListMembershipRegistered
      parameters:
        - $ref: '#/components/parameters/count'
      responses:
        '200':
          description: Group membership reporting returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataGenericCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
