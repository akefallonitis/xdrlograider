  /reporting/reports/v2/windowsFeatureUpdates/distinct/planTypes/{plan}:
    post:
      tags: [Reporting]
      summary: Get feature update distinct filter values
      description: |
        Returns Windows feature update distinct-column values used to populate report filters.
        The route was recovered from the report bundle and confirmed with a safe probe.
      operationId: IntuneAutopatch.Reporting.GetFeatureUpdateDistinctColumns
      parameters:
        - $ref: '#/components/parameters/plan'
        - $ref: '#/components/parameters/reportApiVersion2'
        - $ref: '#/components/parameters/includeHistoricalValue'
      responses:
        '200':
          description: Feature update distinct-column values returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureUpdateDistinctColumnsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
