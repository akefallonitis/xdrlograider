  /support/v1/RequestTypeHierarchy:
    get:
      tags: [Support]
      summary: Get support request type hierarchy
      description: |
        Returns the request-type hierarchy used when creating or categorizing Windows Autopatch
        support requests. Recovered from the support bundles and confirmed with a GET probe.
      operationId: IntuneAutopatch.Support.GetRequestTypeHierarchy
      responses:
        '200':
          description: Support request type hierarchy returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RequestTypeNode'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
