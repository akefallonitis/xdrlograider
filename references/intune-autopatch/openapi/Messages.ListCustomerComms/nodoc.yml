  /support/v1/Messages/CustomerComms:
    get:
      tags: [Messages]
      summary: List customer communications
      description: |
        Returns Windows Autopatch customer communications shown on the Messages blade.
      operationId: IntuneAutopatch.Messages.ListCustomerComms
      responses:
        '200':
          description: Customer communications returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerCommMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
