  /reporting/reports/v1/export/status/:
    get:
      tags: [Reporting]
      summary: Get report export job status
      description: |
        Polls the report export helper until an export SAS URL is ready. This concrete path was
        recovered from the report bundle; it was not exercised live in this pass.
      operationId: IntuneAutopatch.Reporting.GetExportStatus
      parameters:
        - $ref: '#/components/parameters/reportApiVersion1'
        - $ref: '#/components/parameters/exportQueryName'
        - $ref: '#/components/parameters/exportQueryVersion'
        - $ref: '#/components/parameters/exportTrackingId'
      responses:
        '200':
          description: Export status returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportExportStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
