  /support/odata/v1/supportRequests('{supportRequestId}')/UpdateContact:
    post:
      tags: [Support]
      summary: Update support request contact
      description: |
        Updates the contact block on a Windows Autopatch support request. The exact request body was
        recovered from the Support requests bundle. This write was not executed live in this pass.
      operationId: IntuneAutopatch.Support.UpdateSupportRequestContact
      parameters:
        - $ref: '#/components/parameters/supportRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupportRequestUpdateContactRequest'
      responses:
        '200':
          description: Support request contact updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportRequest'
        '204':
          description: Support request contact updated successfully with no response body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
