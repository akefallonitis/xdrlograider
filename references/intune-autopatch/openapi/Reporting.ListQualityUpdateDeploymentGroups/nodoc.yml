  /reporting/reports/v2/deviceAccounting/wqu/summary/deploymentgroups:
    post:
      tags: [Reporting]
      summary: List quality update deployment group summaries
      description: |
        Returns Windows quality update summary rows grouped by deployment group for a selected
        business group. The route was recovered from the report bundle and then confirmed with a
        safe probe using a live `businessGroupId` captured from the summary grid.
      operationId: IntuneAutopatch.Reporting.ListQualityUpdateDeploymentGroups
      parameters:
        - $ref: '#/components/parameters/reportApiVersion2'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QualityUpdateSummaryDeploymentGroupsRequest'
      responses:
        '200':
          description: Quality update deployment group summary returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QualityUpdateDeploymentGroupSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
