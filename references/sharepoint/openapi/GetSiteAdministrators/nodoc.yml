  /_api/SPO.Tenant/GetSiteAdministrators:
    post:
      tags: [Sites]
      summary: Get site administrators
      description: |
        Returns the site administrators displayed on the Membership tab of a
        SharePoint admin site detail blade.
      operationId: SharePointAdmin.GetSiteAdministrators
      parameters:
        - $ref: '#/components/parameters/QuotedSiteId'
        - $ref: '#/components/parameters/XRequestDigest'
        - $ref: '#/components/parameters/SdkVersion'
        - $ref: '#/components/parameters/ODataVersion'
      x-nodoc-operation-context:
        surface: Sites > Membership
        workflows:
          - Open a site detail blade and switch to the Membership tab to resolve the current site administrators.
        headerProfile: sharepoint-admin-write
        variants:
          - location: query
            selector: siteId
            notes: The portal URL-encodes the quoted siteId literal in the query string when it calls the membership helper.
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Verified from authenticated SharePoint site-detail membership browsing.
      responses:
        '200':
          description: Site administrators returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SiteAdministratorsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  "/_api/SP.CompliancePolicy.SPPolicyStoreProxy.CheckSiteIsDeletableById('{siteId}')":
    get:
      tags: [Sites]
      summary: Check whether a site can be deleted
      description: |
        Returns whether the selected site is eligible for deletion after the
        SharePoint admin center runs its compliance-policy checks.
      operationId: SharePointAdmin.CheckSiteIsDeletableById
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site deletion eligibility returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataBooleanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
