  /_api/SPOInternalUseOnly.Tenant/CheckTenantLicenses:
    get:
      tags: [Internal]
      summary: Check tenant licenses
      description: |
        Returns whether the tenant holds the specified internal SharePoint
        license set. Observed with `licenses=["SPO_Project"]`.
      operationId: SharePointAdmin.CheckTenantLicenses
      parameters:
        - $ref: '#/components/parameters/Licenses'
      responses:
        '200':
          description: License check completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
