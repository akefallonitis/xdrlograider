  /_api/web/GetClientSideComponents:
    post:
      tags: [Internal]
      summary: Get client-side component manifests
      description: |
        Returns SPFx component manifests used by the SharePoint admin center to
        light up internal UI bundles.
      operationId: SharePointAdmin.GetClientSideComponents
      parameters:
        - $ref: '#/components/parameters/XRequestDigest'
        - $ref: '#/components/parameters/SdkVersion'
        - $ref: '#/components/parameters/ODataVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientSideComponentsRequest'
      responses:
        '200':
          description: Component manifests returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
