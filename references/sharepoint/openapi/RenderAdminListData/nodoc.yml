  /_api/SPO.Tenant/RenderAdminListData:
    post:
      tags: [Sites]
      summary: Render admin list data
      description: |
        Renders the internal admin-list payload used by the Active sites grid.
        The request body carries the CAML view definition the portal wants to render.
      operationId: SharePointAdmin.RenderAdminListData
      parameters:
        - $ref: '#/components/parameters/XRequestDigest'
        - $ref: '#/components/parameters/SdkVersion'
        - $ref: '#/components/parameters/ODataVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminListDataRequest'
      x-nodoc-operation-context:
        surface: Active sites
        workflows:
          - Open the Active sites grid and let the portal render the internal admin-list payload for the current view, filter, and paging state.
        headerProfile: sharepoint-admin-write
        requestShapes:
          - name: admin-list-caml-view
            contentType: application/json
            bodyKind: caml-render-request
            notes: The portal posts the internal CAML view definition plus paging and filter state for the admin grid.
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Verified from authenticated Active sites grid rendering flows.
      responses:
        '200':
          description: Admin list data returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
