  /_api/SPO.Tenant/GetAdminListViews:
    get:
      tags: [Sites]
      summary: Get admin list views
      description: |
        Returns the internal list views used by the SharePoint admin center to
        render site inventory data.
      operationId: SharePointAdmin.GetAdminListViews
      responses:
        '200':
          description: Admin list views returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  "/_api/SPO.Tenant/sites('{siteId}')":
    get:
      tags: [Sites]
      summary: Get site details by id
      description: |
        Returns the site-properties entity loaded when the Active sites grid
        opens a site detail blade. Observed on the detail overview and settings
        tabs.
      operationId: SharePointAdmin.GetSiteById
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Site detail entity returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
