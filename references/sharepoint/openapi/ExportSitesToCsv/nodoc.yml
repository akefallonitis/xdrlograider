  /_api/SPO.Tenant/ExportToCSV:
    post:
      tags: [Sites]
      summary: Start a CSV export
      description: |
        Starts a site inventory CSV export and returns the generated document
        library path. Observed from the Active sites Export action.
      operationId: SharePointAdmin.ExportSitesToCsv
      parameters:
        - $ref: '#/components/parameters/XRequestDigest'
        - $ref: '#/components/parameters/SdkVersion'
        - $ref: '#/components/parameters/ODataVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExportToCsvRequest'
      x-nodoc-operation-context:
        surface: Active sites > Export
        workflows:
          - Use the Active sites export action to generate a CSV from the current inventory selection.
        headerProfile: sharepoint-admin-write
        requestShapes:
          - name: admin-sites-export
            contentType: application/json
            bodyKind: export-request
            notes: The portal posts the current site inventory selection and export options before returning the document library path.
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Verified from authenticated Active sites export flows.
      responses:
        '200':
          description: Export path returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataStringResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
