  /_api/SPOInternalUseOnly.Tenant:
    get:
      tags: [Internal]
      summary: Get internal-only tenant properties
      description: |
        Returns internal-only SharePoint tenant properties that the admin center
        uses for sharing, versioning, expiration, and custom-script controls.
      operationId: SharePointAdmin.GetInternalTenantProperties
      parameters:
        - $ref: '#/components/parameters/Select'
      responses:
        '200':
          description: Internal tenant properties returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
