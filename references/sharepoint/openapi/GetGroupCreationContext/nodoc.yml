  /_api/GroupSiteManager/GetGroupCreationContext:
    get:
      tags: [Groups]
      summary: Get group creation context
      description: |
        Returns the context block used by SharePoint group-connected site
        creation, including classification and policy settings.
      operationId: SharePointAdmin.GetGroupCreationContext
      responses:
        '200':
          description: Group creation context returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
