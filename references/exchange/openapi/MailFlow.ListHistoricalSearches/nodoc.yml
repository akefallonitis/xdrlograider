  /beta/HistoricalSearch:
    get:
      tags: [MailFlow]
      summary: List historical message trace searches
      description: |
        Returns the historical search jobs surfaced by the Exchange message trace and report
        workflows. The observed tenant response was an empty OData collection.
      operationId: ExchangeBeta.MailFlow.ListHistoricalSearches
      responses:
        '200':
          description: Historical searches returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
