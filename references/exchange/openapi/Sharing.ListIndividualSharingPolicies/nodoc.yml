  /beta/IndividualSharing:
    get:
      tags: [Sharing]
      summary: List individual sharing policies
      description: |
        Returns the individual sharing policy inventory surfaced by the Organization sharing page.
      operationId: ExchangeBeta.Sharing.ListIndividualSharingPolicies
      responses:
        '200':
          description: Individual sharing policies returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  "/beta/IndividualSharing({individualSharingId})":
    get:
      tags: [Sharing]
      summary: Get individual sharing policy details
      description: |
        Returns a single individual sharing policy entity loaded by the Organization sharing
        detail blade.
      operationId: ExchangeBeta.Sharing.GetIndividualSharingPolicy
      parameters:
        - $ref: '#/components/parameters/individualSharingId'
      responses:
        '200':
          description: Individual sharing policy returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericObject'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
