  /beta/Recipient/ExchangeAdminCenter.GetRecipientsIC:
    get:
      tags: [Objects]
      summary: Get recipient inventory for the Exchange list view
      description: |
        Returns the recipient collection used by Exchange list experiences such as Groups and
        related recipient-driven blades.
      operationId: ExchangeBeta.Objects.GetRecipientsIC
      responses:
        '200':
          description: Recipient list returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
