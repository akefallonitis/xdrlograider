  /beta/ActiveSyncDeviceClass:
    get:
      tags: [Mobile]
      summary: List ActiveSync device classes
      description: |
        Returns device class definitions surfaced by the Mobile device access page.
      operationId: ExchangeBeta.Mobile.ListActiveSyncDeviceClasses
      responses:
        '200':
          description: ActiveSync device classes returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
