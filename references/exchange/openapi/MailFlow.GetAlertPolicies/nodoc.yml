  /beta/ProtectionAlert/ExchangeAdminCenter.GetAlertPolicies():
    get:
      tags: [MailFlow]
      summary: Get Exchange alert policies
      description: |
        Returns the alert policy payload used by the Exchange admin center Alert policies page.
      operationId: ExchangeBeta.MailFlow.GetAlertPolicies
      responses:
        '200':
          description: Alert policies returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
