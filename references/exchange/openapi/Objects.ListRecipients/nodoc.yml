  /beta/Recipient:
    get:
      tags: [Objects]
      summary: List recipients for mailbox detail selectors
      description: |
        Returns the recipient picker inventory used by mailbox detail blades and Exchange
        selector experiences. Observed requests selected core identity fields and filtered by
        recipient type.
      operationId: ExchangeBeta.Objects.ListRecipients
      responses:
        '200':
          description: Recipients returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  "/beta/Mailbox({mailboxId})":
    get:
      tags: [Objects]
      summary: Get mailbox details
      description: |
        Returns the mailbox entity loaded by mailbox detail blades, including identity,
        addressing, recipient type, and mailbox configuration fields.
      operationId: ExchangeBeta.Objects.GetMailbox
      parameters:
        - $ref: '#/components/parameters/mailboxId'
      responses:
        '200':
          description: Mailbox details returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeMailbox'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  "/beta/Mailbox({mailboxId})/ExchangeAdminCenter.GetMailboxStatistics(Archive=false)":
    get:
      tags: [Objects]
      summary: Get mailbox statistics
      description: |
        Returns mailbox statistics for the primary mailbox, including last logon time and total
        item size. Observed from mailbox detail blades with `Archive=false`.
      operationId: ExchangeBeta.Objects.GetMailboxStatistics
      parameters:
        - $ref: '#/components/parameters/mailboxId'
      responses:
        '200':
          description: Mailbox statistics returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeMailboxStatistics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

