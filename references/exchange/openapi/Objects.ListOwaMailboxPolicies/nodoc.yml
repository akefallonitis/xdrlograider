  /beta/OwaMailboxPolicy:
    get:
      tags: [Objects]
      summary: List Outlook on the web mailbox policies
      description: |
        Returns the Outlook on the web mailbox policies surfaced by the OWA policies page.
      operationId: ExchangeBeta.Objects.ListOwaMailboxPolicies
      responses:
        '200':
          description: OWA mailbox policies returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  "/beta/Groupv05('{groupId}')/AcceptMessagesOnlyFromSendersOrMembers":
    get:
      tags: [Objects]
      summary: List approved senders for a group
      description: |
        Returns the allowed senders and members collection used by group delivery-management
        settings in Exchange group detail blades.
      operationId: ExchangeBeta.Objects.ListGroupApprovedSenders
      parameters:
        - $ref: '#/components/parameters/groupId'
      responses:
        '200':
          description: Approved group senders returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  "/beta/Groupv05('{groupId}')/BypassModerationFromSendersOrMembers":
    get:
      tags: [Objects]
      summary: List moderation bypass senders for a group
      description: |
        Returns the senders and members that bypass moderation for a group detail blade.
      operationId: ExchangeBeta.Objects.ListGroupModerationBypassSenders
      parameters:
        - $ref: '#/components/parameters/groupId'
      responses:
        '200':
          description: Group moderation bypass senders returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  "/beta/Groupv05('{groupId}')/ModeratedBy":
    get:
      tags: [Objects]
      summary: List moderators for a group
      description: |
        Returns the moderator collection used by Exchange group detail blades.
      operationId: ExchangeBeta.Objects.ListGroupModerators
      parameters:
        - $ref: '#/components/parameters/groupId'
      responses:
        '200':
          description: Group moderators returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
