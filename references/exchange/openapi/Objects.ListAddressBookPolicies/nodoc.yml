  /beta/AddressBookPolicy:
    get:
      tags: [Objects]
      summary: List address book policies
      description: |
        Returns the address book policies surfaced by Exchange resource and policy blades. The
        observed tenant response was an empty OData collection.
      operationId: ExchangeBeta.Objects.ListAddressBookPolicies
      responses:
        '200':
          description: Address book policies returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
