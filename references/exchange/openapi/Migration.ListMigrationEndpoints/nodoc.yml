  /beta/MigrationEndpoint:
    get:
      tags: [Migration]
      summary: List migration endpoints
      description: |
        Returns migration endpoints surfaced by the Exchange migration experience.
      operationId: ExchangeBeta.Migration.ListMigrationEndpoints
      responses:
        '200':
          description: Migration endpoints returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
