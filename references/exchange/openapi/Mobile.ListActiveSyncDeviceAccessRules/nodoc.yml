  /beta/ActiveSyncDeviceAccessRule:
    get:
      tags: [Mobile]
      summary: List ActiveSync device access rules
      description: |
        Returns ActiveSync access rules surfaced by the Mobile device access page.
      operationId: ExchangeBeta.Mobile.ListActiveSyncDeviceAccessRules
      responses:
        '200':
          description: ActiveSync device access rules returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
