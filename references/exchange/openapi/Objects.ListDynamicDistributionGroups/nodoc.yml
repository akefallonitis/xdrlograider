  /beta/DynamicDistributionGroupIC:
    get:
      tags: [Objects]
      summary: List dynamic distribution groups
      description: |
        Returns dynamic distribution groups surfaced by the Groups page in the Exchange admin
        center.
      operationId: ExchangeBeta.Objects.ListDynamicDistributionGroups
      responses:
        '200':
          description: Dynamic distribution groups returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
