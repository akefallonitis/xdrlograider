  /beta/RoleGroup:
    get:
      tags: [Roles]
      summary: List Exchange role groups
      description: |
        Returns Exchange role groups used by the Admin roles page.
      operationId: ExchangeBeta.Roles.ListRoleGroups
      responses:
        '200':
          description: Role groups returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
