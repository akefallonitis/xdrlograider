  /beta/MigrationBatch:
    get:
      tags: [Migration]
      summary: List migration batches
      description: |
        Returns migration batches displayed by the Exchange migration experience. The observed
        tenant response was an empty OData collection.
      operationId: ExchangeBeta.Migration.ListMigrationBatches
      responses:
        '200':
          description: Migration batches returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
