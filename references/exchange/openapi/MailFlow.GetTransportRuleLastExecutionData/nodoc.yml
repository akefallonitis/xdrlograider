  /beta/MailflowReport/ExchangeAdminCenter.EtrLastExecutionData:
    get:
      tags: [MailFlow]
      summary: Get transport rule last-execution data
      description: |
        Returns the last execution timestamp for transport rules shown by Exchange admin center
        reporting widgets.
      operationId: ExchangeBeta.MailFlow.GetTransportRuleLastExecutionData
      responses:
        '200':
          description: Transport rule last-execution data returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeLastExecutionDataCollectionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  "/beta/MailflowReportTDP/ExchangeAdminCenter.CustomerInsight(StartDate={startDate},EndDate={endDate},InsightType='{insightType}')":
    get:
      tags: [MailFlow]
      summary: Get Exchange customer insight data
      description: |
        Returns the customer insight widgets shown on the Exchange dashboard. Observed insight
        types were `CertExpiry`, `HotRecipient`, `MailLoop`, `NewDomainsForwarding`,
        `SlowTransportRule`, and `NewUsersForwarding`.
      operationId: ExchangeBeta.MailFlow.GetCustomerInsight
      parameters:
        - $ref: '#/components/parameters/startDate'
        - $ref: '#/components/parameters/endDate'
        - $ref: '#/components/parameters/insightType'
      responses:
        '200':
          description: Customer insight data returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataCollectionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
