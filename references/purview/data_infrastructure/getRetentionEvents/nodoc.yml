  /di/find/RetentionEvent:
    get:
      operationId: getRetentionEvents
      summary: Get retention events
      description: >-
        Retrieve retention events from the Data Infrastructure service.
        Retention events trigger the start of retention periods for event-based retention labels.
      tags: [DataInfrastructure]
      parameters:
        - name: tenantId
          in: query
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
