  /di/find/ProtectionAlert:
    get:
      operationId: getProtectionAlertDefinitions
      summary: Get protection alert definitions
      description: >-
        Retrieve protection alert definitions from the Data Infrastructure service.
        These define the conditions under which protection alerts are generated.
      tags: [DataInfrastructure]
      parameters:
        - name: tenantId
          in: query
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
