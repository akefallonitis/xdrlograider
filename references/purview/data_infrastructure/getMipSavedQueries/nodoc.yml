  /di/find/MIPSavedQuery:
    get:
      operationId: getMipSavedQueries
      summary: Get MIP saved queries
      description: >-
        Retrieve saved queries for Content Explorer from the Microsoft Information Protection service.
        Supports pagination and filtering of saved query results.
      tags: [DataInfrastructure]
      parameters:
        - name: tenantId
          in: query
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
        - name: PageSize
          in: query
          required: false
          description: The number of results to return per page.
          schema:
            type: integer
        - name: Filter
          in: query
          required: false
          description: OData-style filter expression to narrow results.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
