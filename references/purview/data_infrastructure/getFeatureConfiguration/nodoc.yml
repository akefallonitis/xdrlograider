  /di/find/FeatureConfiguration:
    get:
      operationId: getFeatureConfiguration
      summary: Get feature configuration flags
      description: >-
        Retrieve feature configuration flags from the Data Infrastructure service.
        Used to determine which features are enabled or disabled for the tenant.
      tags: [DataInfrastructure]
      parameters:
        - name: tenantId
          in: query
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
        - name: filter
          in: query
          required: false
          description: OData-style filter expression, typically filtering by FeatureScenario.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
