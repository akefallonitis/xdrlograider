  /di/search/LabelAnalyticsActivityData:
    post:
      operationId: searchLabelAnalyticsActivityData
      summary: Search label analytics activity data
      description: >-
        Search label analytics activity data from the Data Infrastructure service.
        Returns activity data for sensitivity label usage within a time range and store type.
      tags: [DataInfrastructure]
      parameters:
        - name: tenantid
          in: query
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
        - name: startTime
          in: query
          required: false
          description: The start of the time range for activity data (ISO 8601 format).
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          required: false
          description: The end of the time range for activity data (ISO 8601 format).
          schema:
            type: string
            format: date-time
        - name: StoreType
          in: query
          required: false
          description: The store type to filter activity data by.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: pending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
