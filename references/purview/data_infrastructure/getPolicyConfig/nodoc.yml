  /di/find/PolicyConfig:
    get:
      operationId: getPolicyConfig
      summary: Get policy configuration
      description: >-
        Retrieve policy configuration from the Data Infrastructure service.
        Returns the current policy settings for the tenant.
      tags: [DataInfrastructure]
      parameters:
        - name: tenantId
          in: query
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
