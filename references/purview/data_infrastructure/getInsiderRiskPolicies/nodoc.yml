  /di/find/InsiderRiskPolicy:
    get:
      operationId: getInsiderRiskPolicies
      summary: Get insider risk management policies
      description: >-
        Retrieve insider risk management policies from the Data Infrastructure service.
        These policies define the indicators and thresholds for insider risk detection.
      tags: [DataInfrastructure]
      parameters:
        - name: tenantId
          in: query
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
