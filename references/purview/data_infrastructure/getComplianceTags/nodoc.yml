  /di/find/ComplianceTag:
    get:
      operationId: getComplianceTags
      summary: Get retention/compliance tags
      description: >-
        Retrieve retention and compliance tags from the Data Infrastructure service.
        These tags are used for records management and data lifecycle governance.
      tags: [DataInfrastructure]
      parameters:
        - name: tenantId
          in: query
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
