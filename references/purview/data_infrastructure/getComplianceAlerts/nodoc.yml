  /di/find/Alert:
    get:
      operationId: getComplianceAlerts
      summary: Get compliance alerts
      description: >-
        Retrieve compliance alerts from the Data Infrastructure service.
        Supports filtering by alert properties and pagination.
      tags: [DataInfrastructure]
      parameters:
        - name: tenantid
          in: query
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
        - name: Filter
          in: query
          required: false
          description: OData-style filter expression to narrow results.
          schema:
            type: string
        - name: pagesize
          in: query
          required: false
          description: The number of results to return per page.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
