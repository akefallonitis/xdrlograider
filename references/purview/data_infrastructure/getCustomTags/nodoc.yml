  /di/find/CustomTag:
    get:
      operationId: getCustomTags
      summary: Get custom alert tags
      description: >-
        Retrieve custom alert tags from the Data Infrastructure service.
        Supports filtering to include or exclude deleted tags.
      tags: [DataInfrastructure]
      parameters:
        - name: tenantid
          in: query
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
        - name: filter
          in: query
          required: false
          description: OData-style filter expression, typically filtering by IncludeDeleted.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
