  /di/find/ProtectionCompliancePolicy:
    get:
      operationId: getProtectionCompliancePolicies
      summary: Get protection compliance policies
      description: >-
        Retrieve protection compliance policies from the Data Infrastructure service.
        These policies govern data protection and compliance enforcement across the tenant.
      tags: [DataInfrastructure]
      parameters:
        - name: tenantid
          in: query
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/InsiderRiskPolicyResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
