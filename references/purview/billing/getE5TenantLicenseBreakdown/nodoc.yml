  /cbill/LicenseUsage/E5TenantLicenseBreakdown:
    get:
      operationId: getE5TenantLicenseBreakdown
      summary: Get E5 tenant license breakdown
      description: >-
        Retrieve the E5 license breakdown shown by Purview's License Usage
        report.
      tags: [Billing]
      parameters:
        - name: date
          in: query
          required: false
          description: The reporting timestamp used by the license usage blade.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
