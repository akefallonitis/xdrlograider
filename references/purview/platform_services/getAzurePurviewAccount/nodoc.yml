  /azurepurview/account:
    get:
      operationId: getAzurePurviewAccount
      summary: Get Azure Purview account info
      description: >-
        Retrieve Azure Purview account information. Returns details about the
        Azure Purview account associated with the tenant.
      tags: [PlatformServices]
      parameters:
        - name: api-version
          in: query
          required: false
          description: The API version to use for the request.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
