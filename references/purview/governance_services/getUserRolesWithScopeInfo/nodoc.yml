  /gws/ComplianceAuthServer/v1.0/GetUserRolesWithScopeInfo:
    post:
      operationId: getUserRolesWithScopeInfo
      summary: Get user roles with scope information
      description: >-
        Retrieve the current user's roles along with their associated scope information.
        Returns detailed role assignments including administrative unit scoping.
      tags: [GovernanceServices]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: pending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
