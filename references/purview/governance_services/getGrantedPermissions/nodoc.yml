  /gws/ComplianceAuthServer/v1.0/GetGrantedPermissions:
    post:
      operationId: getGrantedPermissions
      summary: Get granted permissions
      description: >-
        Retrieve granted permissions shown by Purview's Data Loss Prevention
        role-group drill-in experience.
      tags: [GovernanceServices]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: pending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
