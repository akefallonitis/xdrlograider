  /dgs/aggregate/GetTypeAggregates:
    get:
      operationId: getDataGovernanceTypeAggregates
      summary: Get type aggregates
      description: >-
        Retrieve type aggregates from the Data Governance Services.
        Returns aggregated counts and statistics grouped by data type.
      tags: [DataGovernance]
      parameters:
        - name: type
          in: query
          required: false
          description: The type of aggregate to retrieve.
          schema:
            type: string
        - name: fetchTagNames
          in: query
          required: false
          description: Whether to include tag names in the response.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/DataGovernanceTypeAggregatesResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
