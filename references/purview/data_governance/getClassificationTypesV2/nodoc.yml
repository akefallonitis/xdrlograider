  /dgs/item/GetTypesV2:
    get:
      operationId: getClassificationTypesV2
      summary: Get classification types V2
      description: >-
        Retrieve classification types (version 2) from the Data Governance Services.
        Returns the available classification type definitions for data cataloging.
      tags: [DataGovernance]
      parameters:
        - name: types
          in: query
          required: false
          description: Comma-separated list of classification types to retrieve.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound