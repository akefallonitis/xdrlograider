  /msgraph/v1.0/subscribedSkus:
    get:
      operationId: getSubscribedSkus
      summary: Get subscribed SKUs (license info)
      description: >-
        Retrieve the list of subscribed SKUs (license information) via the Microsoft Graph proxy.
        Returns all commercial subscriptions that the tenant has acquired.
      tags: [GraphProxy]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
