  /msgraph/beta/identity/conditionalAccess/policies:
    get:
      operationId: getConditionalAccessPolicies
      summary: Get conditional access policies
      description: >-
        Retrieve conditional access policies via the Microsoft Graph beta proxy.
        Returns the tenant's conditional access policy configurations.
      tags: [GraphProxy]
      parameters:
        - name: $filter
          in: query
          required: false
          description: OData filter expression to narrow policies.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
