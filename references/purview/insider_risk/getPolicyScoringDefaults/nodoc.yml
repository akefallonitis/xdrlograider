  /insiderrisk/insiderrisk/api/v1.0/{tenantId}/PolicyScoringDefaults:
    get:
      operationId: getPolicyScoringDefaults
      summary: Get Insider Risk policy scoring defaults
      description: >-
        Retrieve default policy scoring settings used by Purview's Insider Risk
        application settings experience.
      tags: [InsiderRisk]
      parameters:
        - name: tenantId
          in: path
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
