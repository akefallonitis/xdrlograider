  /WdatpPublicApi/irm/tenant/status:
    get:
      operationId: getPurviewAiIrmTenantStatus
      summary: Get IRM tenant status
      description: >-
        Retrieve tenant-level Information Rights Management status used by
        Purview for AI overview cards.
      tags: [PurviewForAI]
      parameters:
        - name: tenantId
          in: query
          required: true
          description: The tenant GUID whose IRM status is being queried.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound