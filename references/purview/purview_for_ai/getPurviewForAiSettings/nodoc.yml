  /di/find/PurviewForAISetting:
    get:
      operationId: getPurviewForAiSettings
      summary: Get Purview for AI settings
      description: >-
        Retrieve Purview for AI feature and onboarding settings for the tenant.
      tags: [PurviewForAI]
      parameters:
        - name: tenantId
          in: query
          required: true
          description: The tenant GUID used by the Purview for AI service.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
