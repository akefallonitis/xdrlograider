  /oversharing/api/v1/p4ai/assessment:
    get:
      operationId: listPurviewAiOversharingAssessments
      summary: List Purview for AI oversharing assessments
      description: >-
        Retrieve oversharing assessments shown on Purview for AI overview
        surfaces.
      tags: [PurviewForAI]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  "/oversharing/api/v1/p4ai/assessment('{assessmentId}')":
    get:
      operationId: getPurviewAiOversharingAssessment
      summary: Get Purview for AI oversharing assessment
      description: >-
        Retrieve a single oversharing assessment from the Purview for AI
        Explorer experience.
      tags: [PurviewForAI]
      parameters:
        - name: assessmentId
          in: path
          required: true
          description: The unique identifier of the oversharing assessment.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
