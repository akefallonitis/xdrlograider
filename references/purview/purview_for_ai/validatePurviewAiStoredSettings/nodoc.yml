  /oversharing/api/v1/p4ai/tenantSettings/validateStored:
    post:
      operationId: validatePurviewAiStoredSettings
      summary: Validate stored oversharing settings
      description: >-
        Validate previously stored oversharing settings before running Purview
        for AI Explorer workflows. Observed returning 404 when no stored
        configuration existed.
      tags: [PurviewForAI]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: pending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
