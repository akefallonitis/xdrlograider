  /edlp/dlpInternalApi/api/cloud/dlp/logCollections/:
    get:
      operationId: listEndpointDlpLogCollections
      summary: List endpoint DLP log collections
      description: >-
        Retrieve endpoint DLP log collection status for a device details blade
        surfaced from Purview device settings.
      tags: [DLPDevices]
      parameters:
        - name: MachineId
          in: query
          required: false
          description: The machine identifier for the device whose log collections are being queried.
          schema:
            type: string
        - name: Status
          in: query
          required: false
          description: Filter log collections by collection status.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
