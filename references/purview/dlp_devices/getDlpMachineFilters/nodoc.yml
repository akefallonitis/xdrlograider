  /mtp/ndr/dlpmachines/filters:
    get:
      operationId: getDlpMachineFilters
      summary: Get DLP machine filters
      description: >-
        Retrieve the filter options used by Purview's affected devices drill-in
        from the Data Loss Prevention overview page.
      tags: [DLPDevices]
      parameters:
        - name: lookingBackInDays
          in: query
          required: false
          description: Number of days to look back for machine activity.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
