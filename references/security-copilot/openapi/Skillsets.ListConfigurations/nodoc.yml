  /pods/{podId}/workspaces/{workspaceName}/securitycopilot/skillsets/configurations:
    get:
      tags: [Builder]
      summary: List skillset configurations
      description: Retrieves saved skillset configuration and auth metadata used by Builder onboarding and setup flows.
      operationId: SecurityCopilotPortal.Skillsets.ListConfigurations
      parameters:
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/WorkspaceName'
        - $ref: '#/components/parameters/SkillsetConfigurationScope'
      responses:
        '200':
          description: Skillset configurations returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListEnvelope'
