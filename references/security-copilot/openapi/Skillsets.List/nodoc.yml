  /pods/{podId}/workspaces/{workspaceName}/securitycopilot/skillsets:
    get:
      tags: [Builder]
      summary: List skillsets and plugins
      description: Retrieves the available skillsets and plugin-like capabilities shown in Promptbooks and Builder.
      operationId: SecurityCopilotPortal.Skillsets.List
      parameters:
        - $ref: '#/components/parameters/PodId'
        - $ref: '#/components/parameters/WorkspaceName'
      responses:
        '200':
          description: Skillsets returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericListEnvelope'
