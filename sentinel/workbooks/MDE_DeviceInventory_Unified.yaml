# MDE — Device Inventory (Unified) workbook (Hot-Fix 14, 2026-05-10).
#
# Per-device 360 drilldown unifying Microsoft Defender XDR portal-internal
# telemetry across 4 consolidated workspace tables. 8 panels:
#   1. Top 50 devices — risk + exposure posture
#   2. Per-device CVE drilldown (cross-table HostMdatpId join)
#   3. Endpoint security policies applied per platform (TemplateFamily breakdown)
#   4. Recent drift events cross-tier (Inventory + Configuration drift parsers)
#   5. Response actions per device (ActionCenter)
#   6. Inactive devices (>7d no heartbeat)
#   7. Onboarding + management state distribution
#   8. Device classification breakdown (DeviceCategory x DeviceType x OsPlatform)
#
# Built ON TOP of Hot-Fix 11 expanded MDE_Machines_CL ProjectionMap (50+ typed
# cols) + Hot-Fix 13 ARM cascading update (DCR streamDecls + workspace cols)
# + Hot-Fix 9 MDE_SecurityPolicies_CL Intune schema rewrite + Hot-Fix 5 drift
# parser cardinality refinement.
#
# Cross-table join model uses Architecture J canonical Sentinel Entity Type
# cols (HostMdatpId, HostFullName, HostAadId) so operators KQL-pivot directly
# without parse_json(RawJson).

name: MDE — Device Inventory (Unified)
description: |
  Per-device 360-degree drilldown unifying Microsoft Defender XDR portal-internal
  telemetry. Picks a machine -> shows CVEs, endpoint security policies (ASR/AV/
  EDR/Firewall), drift events, response actions, classification.

  Use cases: per-device triage, vulnerability prioritization, drift investigation,
  inactive device hunting, cross-table correlation.

  Cross-table join model: every panel keyed on HostMdatpId (or HostFullName/
  HostAadId aliases) — Architecture J canonical Sentinel Entity Type contract.

  Companion workbooks (existing): MDE_ActionCenter, MDE_ComplianceDashboard,
  MDE_DriftReport, MDE_ExposureMap, MDE_GovernanceScorecard, MDE_IdentityPosture,
  MDE_ResponseAudit (per-functional-area dashboards) + XdrLogRaider_ConnectorHealth
  (operator dashboard). NEW v0.1.0.3: MDE_DeviceInventory_Unified (this file).
templateRelativePath: MDE_DeviceInventory_Unified.json
subtitle: SOC analyst dashboard
provider: Community
support: Community
