# XdrLogRaider — Connector Ops dashboard (Hot-Fix 17, 2026-05-10).
#
# Operator-facing operations view focused on connector throughput + reliability
# + cost trends. Complements XdrLogRaider_ConnectorHealth (binary health checks)
# with VELOCITY + DEPTH + RATE telemetry SOC operators need for capacity
# planning + incident triage.
#
# 8 panels:
#   1. Ingestion velocity per category (rows/15min time-series)
#   2. DLQ depth + oldest-entry age trending
#   3. Auth chain failure breakdown (AADSTS code histogram)
#   4. Stream-level health velocity matrix (24h vs prior-24h delta)
#   5. Rate-limit (429) storms per host
#   6. Function App invocation success rate (4 functions + p50/p95/p99 latency)
#   7. Per-stream Hot-Fix 7 truncation events (Ingest.RowTruncated)
#   8. Cost-budget gate trip events (RowVolumeSpike + RowDroppedAfterTruncate)
#
# Built ON TOP of Hot-Fix 7 truncation telemetry, Hot-Fix 6 single-value graphQuery,
# Hot-Fix 8 storage 409 suppression. References AppMetrics emitted by
# Connector-Heartbeat function (xdr.dlq.depth, xdr.dlq.oldest_age_minutes,
# xdr.portal.rate429_count).

