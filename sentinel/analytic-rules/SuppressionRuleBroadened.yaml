id: 1193a026-3e3f-45ab-9646-d3c562d7c964
name: MDE suppression rule broadened
description: |
  Defender alert-suppression rule had `scope`, `conditions`, or `machineGroup` MODIFIED — narrow→broad widening. Suppression rules legitimately silence noisy alerts (test machines, vendor scanners, FPs); narrow-to-broad widening is the textbook attacker move (silence alerts the upcoming payload will trigger across broader scope). One of the highest-value attacker preparation signals. Severity Medium — legitimate scope adjustments occur but every widening needs ticket. MITRE: TA0005 Defense Evasion — T1562.006 Indicator Blocking (PRIMARY). See KQL body for triage path.
severity: Medium
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 15m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562.006
query: |
  MDE_Drift_Configuration(2h, 15m) | where StreamName == "MDE_SuppressionRules_CL" | where ChangeType == "Modified" | where FieldName in ("scope","conditions","machineGroup")
# Hot-Fix 20 (2026-05-10): populate entityMappings from canonical Sentinel Entity
# Type cols (Architecture J output preserved through drift parser per J.6).
# Without these, Sentinel investigation graph cannot pivot from alert -> entity.
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountUPNSuffix
      - identifier: Name
        columnName: AccountName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostFullName
      - identifier: NetBiosName
        columnName: HostName
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
