id: 1cf62c3f-9ce0-41bf-8838-6d4cb19b0699
name: MDE connected app new registration
description: |
  Detects new third-party app registered as a Defender XDR Connected App — programmatic API access to alerts/devices/configurations/IR actions. Each is a stealable credential + privileged token. Unsanctioned apps = persistence mechanism. Severity Low baseline; Medium if Machine.ReadWrite.All or Alert.ReadWrite.All scope. MITRE: TA0003 Persistence — T1098 Account Manipulation; T1136.003 Create Cloud Account. See KQL body for triage path.
severity: Low
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 15m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
relevantTechniques:
  - T1098
query: |
  MDE_Drift_Configuration(6h, 10m) | where StreamName == "MDE_ConnectedApps_CL" | where ChangeType == "Added"
entityMappings: []
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
