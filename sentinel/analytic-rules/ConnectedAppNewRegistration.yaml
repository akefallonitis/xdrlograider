id: d170d6a6-8087-4957-a2f5-057bb2a0e4b4
name: MDE connected app new registration
description: |
  Detects new third-party app registered as a Defender XDR Connected App — programmatic API access to alerts/devices/configurations/IR actions. Each is a stealable credential + privileged token. Unsanctioned apps = persistence mechanism. Severity Low baseline; Medium if Machine.ReadWrite.All or Alert.ReadWrite.All scope. MITRE: TA0003 Persistence — T1098 Account Manipulation; T1136.003 Create Cloud Account. See KQL body for triage path.
severity: Low
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 15m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
relevantTechniques:
  - T1098
query: |
  MDE_Drift_Configuration(6h, 10m) | where StreamName == "MDE_ConnectedApps_CL" | where ChangeType == "Added"
# Hot-Fix 20 (2026-05-10): populate entityMappings from canonical Sentinel Entity
# Type cols (Architecture J output preserved through drift parser per J.6).
# Without these, Sentinel investigation graph cannot pivot from alert -> entity.
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountUPNSuffix
      - identifier: Name
        columnName: AccountName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostFullName
      - identifier: NetBiosName
        columnName: HostName
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
