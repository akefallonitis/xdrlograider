id: 8c9f3ce5-b7e9-4fb9-9313-bfc076b3166d
name: MDE portal config change outside business hours
description: |
  Any Defender XDR tenant-configuration or inventory drift event recorded outside 09:00-17:00 UTC business hours. Attackers prefer off-hours config changes for stealth — fewer eyes, longer notice window, alert flood diluted by next-day signals. Legitimate after-hours changes need paired ticket. Severity Low — high FP volume in 24x7 SOC tenants; primarily context anchor for IR retrospective. Tuning: adjust 9/17 to local business hours; 24x7 ops disable or widen to weekends-only. MITRE: TA0005 Defense Evasion — T1562. See KQL body for triage path.
severity: Low
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 15m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562
query: |
  union (MDE_Drift_Configuration(2h, 15m)), (MDE_Drift_Inventory(2h, 15m)) | extend HourOfDay = datetime_part("Hour", TimeGenerated) | where HourOfDay < 9 or HourOfDay >= 17
# Hot-Fix 20 (2026-05-10): populate entityMappings from canonical Sentinel Entity
# Type cols (Architecture J output preserved through drift parser per J.6).
# Without these, Sentinel investigation graph cannot pivot from alert -> entity.
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountUPNSuffix
      - identifier: Name
        columnName: AccountName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostFullName
      - identifier: NetBiosName
        columnName: HostName
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
