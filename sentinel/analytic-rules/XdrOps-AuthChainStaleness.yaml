id: 99d2c6e8-1485-419a-b9ab-5daaf0954902
name: "[XdrOps] Connector auth chain staleness - silent hang detection"
description: |
  XdrLogRaider's auth chain stopped emitting `AuthChain.Completed` events for >30min — SILENT hang in auth flow. Complement to XdrOps-AuthChainFailure (which catches NOISY failures); this catches SILENT death where auth stops mid-flow without exception. Heartbeat may still fire while data polls are dead. Causes: Microsoft auth throttling without 429, HTTP timeout on portal selfTest, FA host hung, PowerShell module load deadlock. Severity High — silent connector death = SOC visibility loss without explicit alerting. MITRE: TA0001 Initial Access — T1078. See KQL body + docs/RUNBOOK.md "Auth chain hang" section for triage.
severity: High
enabled: false
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - AppEvents
queryFrequency: 30m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1078
query: |
  // Phase J D'.3 (2026-05-04): silent-hang detection in XdrLogRaider auth chain.
  // Service accounts that have NOT successfully completed an auth chain in
  // the last 30 minutes despite the Connector-Heartbeat timer firing.
  let staleThresholdMinutes = 30;
  // Service accounts seen on AuthChain.Started but not AuthChain.Completed
  // since the staleness threshold.
  let recentStarts = AppEvents
    | where TimeGenerated > ago(2h)
    | where Name == 'AuthChain.Started'
    | extend Upn = tostring(Properties.Upn);
  let recentCompletes = AppEvents
    | where TimeGenerated > ago(2h)
    | where Name == 'AuthChain.Completed'
    | extend Upn = tostring(Properties.Upn)
    | summarize LastCompleted = max(TimeGenerated) by Upn;
  recentStarts
  | summarize Started = count() by Upn
  | join kind=leftouter (recentCompletes) on Upn
  | extend MinutesSinceLastCompleted = datetime_diff('minute', now(), coalesce(LastCompleted, datetime(1970-01-01)))
  | where MinutesSinceLastCompleted > staleThresholdMinutes
  | project TimeGenerated = now(), Upn, MinutesSinceLastCompleted, LastCompleted, Started
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: Upn
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: true
suppressionDuration: PT1H
