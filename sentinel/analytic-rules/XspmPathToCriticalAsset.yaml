id: 2c5701fb-00c8-407c-86d8-f65d62c4b8a1
name: MDE XSPM path to critical asset
description: |
  XSPM attack-path simulation identified a route ending at a device tagged `Critical`. Defender continuously simulates attacker progressions; this fires when ANY path now terminates at a crown-jewel asset. Path ending at Critical means attack is feasible TODAY, attacker doesn't need privileged access to start, asset reachable through some chain of compromises. Severity High — paths to Critical assets = top-priority hardening candidates. License: requires XSPM (E5 + Security add-on); dormant on unlicensed tenants. MITRE: TA0043 Reconnaissance — T1595; TA0008 Lateral Movement — T1570. See KQL body for triage path.
severity: High
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 15m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Reconnaissance
  - LateralMovement
relevantTechniques:
  - T1595
  - T1570
query: |
  Defender_ExposureManagement_CL | where SourceName == 'MDE_XspmAttackPaths_CL' | summarize arg_max(TimeGenerated, *) by EntityId | extend TargetCriticality = tostring(parse_json(RawJson).targetCriticality) | where TargetCriticality == "Critical" | where TimeGenerated > ago(1h)
entityMappings: []
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
