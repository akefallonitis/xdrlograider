id: 914fbdd0-46bb-4c04-932f-4de98bbe2197
name: MDE streaming API new target
description: |
  **What it detects:** New Event Hub or Storage target configured for Defender telemetry streaming. Semantic alias for `DataExportNewDestination` — same signal, kept under "streaming API" name for operators searching by Microsoft's legacy nomenclature.

  **Why this matters:** Same data-exfiltration risk as DataExportNewDestination — see that rule for full triage path.

  **Triage path:**
    1. See DataExportNewDestination.yaml triage path — identical
    2. Coordinate alerts: if both rules fire on same drift, treat as one incident not two

  **Severity:** Medium baseline; High if destination external Azure tenant.

  **REDIRECTED 2026-05-06:** legacy `MDE_StreamingApiConfig_CL` is `Availability='deprecated'` (404 on modern tenants). Canonical surface = `MDE_DataExportSettings_CL` (Maintenance tier). Rule kept as semantic alias.

  **MITRE:** TA0010 Exfiltration — T1537 Transfer Data to Cloud Account (PRIMARY).
severity: Medium
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 15m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Exfiltration
relevantTechniques:
  - T1537
query: |
  MDE_Drift_Maintenance(1h, 10m) | where StreamName == "MDE_DataExportSettings_CL" | where ChangeType == "Added"
# Hot-Fix 20 (2026-05-10): populate entityMappings from canonical Sentinel Entity
# Type cols (Architecture J output preserved through drift parser per J.6).
# Without these, Sentinel investigation graph cannot pivot from alert -> entity.
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountUPNSuffix
      - identifier: Name
        columnName: AccountName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostFullName
      - identifier: NetBiosName
        columnName: HostName
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
