id: 5f36b8c9-0e2d-4f4b-a7c9-3d2e5b0f8a0d
name: MDE streaming API new target
description: |
  A new Event Hub or Storage target was configured for Defender telemetry streaming. Possible exfiltration channel.

  REDIRECTED 2026-05-06: the legacy MDE_StreamingApiConfig_CL endpoint is
  Availability='deprecated' (returns 404 on modern tenants — see manifest line
  619). The canonical surface is now MDE_DataExportSettings_CL (Maintenance
  tier). This rule fires when the Maintenance drift parser observes a NEW
  data-export target — overlaps with DataExportNewDestination but kept as a
  semantic alias for operators who searched for "streaming API" specifically.
severity: Medium
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 15m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Exfiltration
relevantTechniques:
  - T1537
query: |
  MDE_Drift_Maintenance(1h, 10m) | where StreamName == "MDE_DataExportSettings_CL" | where ChangeType == "Added"
entityMappings: []
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
