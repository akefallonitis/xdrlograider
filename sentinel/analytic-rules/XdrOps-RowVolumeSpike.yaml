id: 3effaf4a-d884-4a17-9530-d4a8b4080eac
name: "[XdrOps] Connector row-volume spike — cost-budget gate"
description: |
  ANY stream's hourly row count exceeds 3× its 7-day rolling baseline. Cost-budget gate (Sentinel ingestion per-GB; runaway connector can blow monthly budget in days) + quality signal. 3x volume means: operator schema explosion (wildcard PathParams fan out), tenant breach (mass policy push by attacker), connector regression (broken dedup), ProjectionMap mis-config (property-bag flatten N-fold multiplication), or legitimate fleet onboarding (4h suppression handles). Severity Medium — cost impact gradual; investigate within 24h. MITRE: TA0040 Impact — T1565 Data Manipulation. See KQL body + docs/RUNBOOK.md "Row-volume spike" for triage.
severity: Medium
enabled: false
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - AppMetrics
queryFrequency: 1h
queryPeriod: P7D
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Impact
relevantTechniques:
  - T1565
query: |
  // Per-stream cost-budget gate. The metric is emitted by Send-ToLogAnalytics
  // on every successful ingest batch with the Stream property set so we can
  // group per-stream and compare a 1h sliding window against a 7d baseline.
  let recentWindow = 1h;
  let baselineWindow = 7d;
  let spikeFactor = 3.0;
  let recent =
      AppMetrics
      | where TimeGenerated > ago(recentWindow)
      | where Name == "xdr.ingest.row_count_per_hour"
      | extend Stream = tostring(Properties.Stream)
      | summarize RecentRows = sum(Sum) by Stream;
  let baseline =
      AppMetrics
      | where TimeGenerated between (ago(baselineWindow) .. ago(recentWindow))
      | where Name == "xdr.ingest.row_count_per_hour"
      | extend Stream = tostring(Properties.Stream)
      | summarize BaselineRowsPerHour = avg(Sum) by Stream;
  recent
  | join kind=leftouter baseline on Stream
  | extend BaselineRowsPerHour = coalesce(BaselineRowsPerHour, 0.0)
  | where BaselineRowsPerHour > 0  // skip cold-start streams (no baseline yet)
  | where RecentRows > BaselineRowsPerHour * spikeFactor
  | extend SpikeRatio = round(RecentRows / BaselineRowsPerHour, 2)
  | extend AlertReason = strcat("Stream ", Stream, " row volume ", SpikeRatio, "x baseline (recent=", RecentRows, " vs avg=", round(BaselineRowsPerHour, 1), "/h)")
  | project TimeGenerated = now(), Stream, RecentRows, BaselineRowsPerHour, SpikeRatio, AlertReason
entityMappings: []
eventGroupingSettings:
  aggregationKind: AlertPerResult
suppressionEnabled: true
suppressionDuration: PT4H
