id: f3d2618e-5eb7-4520-b033-103e1bed3504
name: MDE alert tuning broadened
description: |
  **What it detects:** A Defender XDR alert-tuning rule had `conditions` or `scope` MODIFIED — broader suppression criteria, potentially hiding legitimate alerts.

  **Why this matters:** Tuning is legitimate FP reduction, but also stealth attacker tactic — broaden tuning to silence alerts before payload. Rule narrowed to "specific service account/machine" being widened to "any" is the classic indicator.

  **Triage path:**
    1. Identify modified rule via EntityId — what alert types are now suppressed?
    2. Verify against change-management ticket
    3. Cross-ref ConfigChangesByUpn for the admin actor
    4. Unauthorized: revert + investigate admin session compromise
    5. Hunt activity in now-suppressed categories during the broadening window

  **Severity:** Medium — common but offers high attacker value (escalate to High if SilentBypassIndicators co-occur).

  **MITRE:** TA0005 Defense Evasion — T1562.006 Indicator Blocking.
severity: Medium
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 1h
queryPeriod: 12h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562.006
# Section R++++++.4 F4 fix (2026-05-07T15:00): MDE_AlertTuning_CL is on
# Configuration tier (6h cadence in production). Old (15m freq / 2h period
# / parser 2h window) over-fired 96x/day AND missed mid-cycle changes.
# New: parser window 12h (2x cadence) catches every cycle; queryPeriod 12h
# matches; queryFrequency 1h gives ~6 firings per cycle without storming.
query: |
  MDE_Drift_Configuration(12h, 1h) | where StreamName == "MDE_AlertTuning_CL" | where ChangeType == "Modified" | where FieldName in ("conditions","scope")
# Hot-Fix 20 (2026-05-10): populate entityMappings from canonical Sentinel Entity
# Type cols (Architecture J output preserved through drift parser per J.6).
# Without these, Sentinel investigation graph cannot pivot from alert -> entity.
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountUPNSuffix
      - identifier: Name
        columnName: AccountName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostFullName
      - identifier: NetBiosName
        columnName: HostName
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
