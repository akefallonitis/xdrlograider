id: 421fd74e-bcd3-45c9-bcae-b9f7f93d6fe2
name: MDE new data export destination
description: |
  Detects new streaming/export destination ADDED to Defender data-export settings (Event Hub, Storage account, or Log Analytics workspace). Same mechanism legitimate SOCs use is also a data-exfiltration channel — attacker adds their own destination, Defender ships raw telemetry (alerts, device events, identity events) to attacker infrastructure. Severity Medium baseline; High if destination external Azure tenant. MITRE: TA0010 Exfiltration — T1537 Transfer Data to Cloud Account (PRIMARY). See KQL body for triage path.
severity: Medium
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 15m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Exfiltration
relevantTechniques:
  - T1537
query: |
  MDE_Drift_Maintenance(1h, 10m) | where StreamName == "MDE_DataExportSettings_CL" | where ChangeType == "Added"
# Hot-Fix 20 (2026-05-10): populate entityMappings from canonical Sentinel Entity
# Type cols (Architecture J output preserved through drift parser per J.6).
# Without these, Sentinel investigation graph cannot pivot from alert -> entity.
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountUPNSuffix
      - identifier: Name
        columnName: AccountName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostFullName
      - identifier: NetBiosName
        columnName: HostName
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
