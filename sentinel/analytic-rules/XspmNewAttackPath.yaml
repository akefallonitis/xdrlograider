id: 24de8cc1-190a-457d-9f36-d7c1462e8efb
name: MDE XSPM new attack path discovered
description: |
  Defender XSPM identified a NEW attack path in last 7d — route from internet/email/identity entry through chain of hops. Every new path = SOMETHING changed that opened new attacker progression (group memberships, new vulnerable software, firewall rules opening lateral movement, identity perms enabling impersonation). Without tracking deltas, you miss gradual posture erosion. Severity Medium — escalate via XspmPathToCriticalAsset if destination Critical. License: requires XSPM (E5 + Security add-on); dormant on unlicensed tenants. MITRE: TA0043 Reconnaissance — T1595 Active Scanning. See KQL body for triage path.
severity: Medium
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 15m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Reconnaissance
relevantTechniques:
  - T1595
query: |
  MDE_Drift_Exposure(7d, 1h) | where StreamName == "MDE_XspmAttackPaths_CL" | where ChangeType == "Added"
entityMappings: []
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
