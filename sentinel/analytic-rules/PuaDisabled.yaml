id: 8d153170-db62-48ea-a694-72831e1c09f9
name: MDE PUA protection disabled
description: |
  Defender PUA (Potentially Unwanted Application) protection disabled tenant-wide (`MDE_PUAConfig_CL.enabled` flipped to `false`). PUA blocks dual-use tools (PsExec, BloodHound, certutil, mimikatz variants) attackers use for lateral movement, credential dumping, recon. Tenant-wide disable = those tools execute silently — strong "attacker preparing hands-on-keyboard activity" signal. Severity High — disabling tier-2 EDR defense rarely benign. MITRE: TA0005 Defense Evasion — T1562.001 (PRIMARY). See KQL body for triage path.
severity: High
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 15m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562.001
query: |
  MDE_Drift_Inventory(2h, 15m) | where StreamName == "MDE_PUAConfig_CL" | where FieldName == "enabled" and NewValue == "false"
# Hot-Fix 20 (2026-05-10): populate entityMappings from canonical Sentinel Entity
# Type cols (Architecture J output preserved through drift parser per J.6).
# Without these, Sentinel investigation graph cannot pivot from alert -> entity.
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountUPNSuffix
      - identifier: Name
        columnName: AccountName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostFullName
      - identifier: NetBiosName
        columnName: HostName
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
