id: 8a3f9c1d-4b2e-4f7a-9c1e-2d6f8a3b9c5e
name: "[XdrOps] Connector tier stale - no ingest beyond expected cadence"
description: |
  XdrLogRaider tier has not written `XdrConnectorHealth_CL` rows for >2x expected cadence — entire dispatch chain (Xdr-Refresh → orchestrator → activity → heartbeat) has stopped for that tier. Each tier (ActionCenter/XspmGraph/Configuration/Inventory/Maintenance/Heartbeat) = logical group of streams polled together; tier silent = ALL streams dark. Thresholds (2x cadence): ActionCenter >20m | XspmGraph >2h | Configuration >12h | Inventory >2d | Maintenance >2w | Heartbeat >10m. Severity Medium — cadence-specific data loss; High if multiple tiers stale. MITRE: TA0005 Defense Evasion — T1562. See KQL body + docs/RUNBOOK.md "Tier stale" for triage.
severity: Medium
enabled: false
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562
query: |
  let cadenceLimits = datatable(Tier: string, MaxStaleMin: long)
  [
      "ActionCenter",   20,
      "XspmGraph",      120,
      "Configuration",  720,
      "Inventory",      2880,
      "Maintenance",    20160,
      "Heartbeat",      10
  ];
  XdrConnectorHealth_CL
  | where TimeGenerated > ago(14d)
  | where isnotempty(Tier)
  | summarize LastSeenUtc = max(TimeGenerated) by Portal, Tier
  | join kind=inner cadenceLimits on Tier
  | extend StaleMin = datetime_diff('minute', now(), LastSeenUtc)
  | where StaleMin > MaxStaleMin
  | project Portal, Tier, LastSeenUtc, StaleMin, MaxStaleMin
entityMappings: []
eventGroupingSettings:
  aggregationKind: AlertPerResult
suppressionEnabled: true
suppressionDuration: PT4H
