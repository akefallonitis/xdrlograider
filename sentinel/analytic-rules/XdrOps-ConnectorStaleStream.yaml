id: 8a3f9c1d-4b2e-4f7a-9c1e-2d6f8a3b9c5e
name: "[XdrOps] Connector tier stale - no ingest beyond expected cadence"
description: |
  XdrLogRaider tier has not ingested rows for >2x expected cadence (poll failure,
  schema drift, portal API change, or auth chain issue).

  Section R consolidation (2026-05-06): the 5 Defender-*-Refresh timers were
  collapsed into one Xdr-Refresh dispatcher; tier identity lives on the `Tier`
  column written by Set-XdrTierStateRow + Connector-Heartbeat aggregator.
  XdrConnectorHealth_CL Tier values: ActionCenter | XspmGraph | Configuration
  | Inventory | Maintenance | Heartbeat. FunctionName is always Connector-Heartbeat.

  Thresholds (2x cadence margin):
    ActionCenter (10m) -> alert >20m | XspmGraph (1h) -> alert >2h
    Configuration (6h) -> alert >12h | Inventory (1d) -> alert >2d
    Maintenance (1w) -> alert >2w   | Heartbeat (5m) -> alert >10m

  Triage in docs/RUNBOOK.md "Tier stale" section.
severity: Medium
enabled: false
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562
query: |
  let cadenceLimits = datatable(Tier: string, MaxStaleMin: long)
  [
      "ActionCenter",   20,
      "XspmGraph",      120,
      "Configuration",  720,
      "Inventory",      2880,
      "Maintenance",    20160,
      "Heartbeat",      10
  ];
  XdrConnectorHealth_CL
  | where TimeGenerated > ago(14d)
  | where isnotempty(Tier)
  | summarize LastSeenUtc = max(TimeGenerated) by Portal, Tier
  | join kind=inner cadenceLimits on Tier
  | extend StaleMin = datetime_diff('minute', now(), LastSeenUtc)
  | where StaleMin > MaxStaleMin
  | project Portal, Tier, LastSeenUtc, StaleMin, MaxStaleMin
entityMappings: []
eventGroupingSettings:
  aggregationKind: AlertPerResult
suppressionEnabled: true
suppressionDuration: PT4H
