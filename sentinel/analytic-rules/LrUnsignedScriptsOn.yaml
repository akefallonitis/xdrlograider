id: cff3f135-05bd-462a-a2c3-fd783780a991
name: MDE Live Response unsigned scripts enabled
description: |
  Defender Live Response `allowUnsignedScripts` flipped to `true` tenant-wide — responders can run arbitrary unsigned PS/bash on any managed endpoint via LR sessions. Code signing is the last layer protecting LR from weaponization; sustained ON = strong "attacker establishing RCE capability" signal. Legitimate responders rarely need this (workaround: pre-sign scripts in IR library). Severity High — admin compromise + this = SYSTEM-equivalent code execution fleet-wide. MITRE: TA0005 Defense Evasion — T1562.001; TA0002 Execution — T1059. See KQL body for triage path.
severity: High
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 15m
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
  - Execution
relevantTechniques:
  - T1562.001
query: |
  MDE_Drift_Inventory(2h, 15m) | where StreamName == "MDE_LiveResponseConfig_CL" | where FieldName == "allowUnsignedScripts" and NewValue == "true"
# Hot-Fix 20 (2026-05-10): populate entityMappings from canonical Sentinel Entity
# Type cols (Architecture J output preserved through drift parser per J.6).
# Without these, Sentinel investigation graph cannot pivot from alert -> entity.
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountUPNSuffix
      - identifier: Name
        columnName: AccountName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostFullName
      - identifier: NetBiosName
        columnName: HostName
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
