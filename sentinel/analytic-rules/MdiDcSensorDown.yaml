id: b51c604a-469d-431e-93d3-17bf728cfc28
name: MDE MDI DC sensor down
description: |
  MDI sensor on a domain controller stopped reporting (`MDE_DCCoverage_CL.IsActive` True→False). Canonical "identity threat detection blind spot" signal. MDI sensors feed AD-side detections (kerberoasting, golden ticket, DCSync, replication abuse, LDAP recon) — inactive sensor = those detections silently disappear. Causes: DC reboot, network partition, service crash, OR attacker action (sensor disable is known tactic to mask DCSync). Severity High — every minute of blind time = potential undetected credential attack. License: requires MDI. MITRE: TA0005 — T1562; TA0006 Credential Access — T1003.006 DCSync. See KQL body for triage path.
severity: High
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 4h
queryPeriod: P2D
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562
# Section R++.C B5/B12 fix (2026-05-07):
#  - queryPeriod was 2h vs parser lookback 2d → previous-snapshot side empty → false-positive flood
#    when first poll lands. Aligned to P2D matching parser lookback.
#  - queryFrequency was 15m vs Inventory cadence 1d → fired ~96x per day on data that updates once/day.
#    Aligned to 4h (still 6x faster than data updates so no missed events; reasonable cost).
#  - FieldName was "hasSensor" but manifest projects upstream HasSensor → IsActive (typed bool col).
#    Drift parser emits typed-col names. Fixed to filter on IsActive.
query: |
  MDE_Drift_Inventory(2d, 1d) | where StreamName == "MDE_DCCoverage_CL" | where FieldName == "IsActive" and OldValue == "True" and NewValue == "False"
# Hot-Fix 20 (2026-05-10): populate entityMappings from canonical Sentinel Entity
# Type cols (Architecture J output preserved through drift parser per J.6).
# Without these, Sentinel investigation graph cannot pivot from alert -> entity.
entityMappings:
  - entityType: Account
    fieldMappings:
      - identifier: FullName
        columnName: AccountUPNSuffix
      - identifier: Name
        columnName: AccountName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostFullName
      - identifier: NetBiosName
        columnName: HostName
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
