id: 0c106d96-4d83-4e92-8dbf-ef2d3e41107d
name: "[XdrOps] Connector auth chain failure - elevated AADSTS exception rate"
description: |
  XdrLogRaider's portal auth chain (TOTP → passkey → ESTSAUTH → sccauth → XSRF-TOKEN) producing `AuthChain.*` exceptions at elevated rate (>3 in 1h window). Auth failure = NO data flows from 65 streams; connector card flips Disconnected, telemetry pipeline goes dark. Causes: SA credential rotation needed, TOTP seed clock drift, Entra CA policy block, portal contract change, or Microsoft auth-service incident. Severity High — connector outage = SOC visibility loss. MITRE: TA0001 Initial Access — T1078 Valid Accounts. See KQL body + docs/RUNBOOK.md "Auth chain failure" section for triage.
severity: High
enabled: false
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - AppExceptions
queryFrequency: 1h
queryPeriod: 4h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1078
query: |
  // Filter to XdrLogRaider Function App App Insights, then to AuthChain.* exception classes.
  // Threshold: >3 AuthChain.* exceptions in 1h window (more than transient ESTS flake).
  AppExceptions
  | where TimeGenerated > ago(4h)
  | extend ErrorClass = tostring(Properties.ErrorClass)
  | where ErrorClass startswith "AuthChain."
  | summarize FailureCount = count(), Stages = make_set(ErrorClass) by bin(TimeGenerated, 1h)
  | where FailureCount > 3
  | project TimeGenerated, FailureCount, Stages
entityMappings: []
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: true
suppressionDuration: PT2H
