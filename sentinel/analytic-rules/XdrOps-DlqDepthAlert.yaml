id: 6d1b7a3e-9f2c-4e8d-a7b1-3c4d5e6f7a8b
name: "[XdrOps] Connector DLQ depth or age exceeds operator threshold"
description: |
  XdrLogRaider's ingest DLQ (Storage Table `xdrIngestDlq`) has Depth >100 entries (sustained backpressure) OR oldest entry >2h (replay isn't keeping up). DLQ = connector safety net for DCE ingestion failures (5xx, 429, network). Healthy: DLQ near-empty as `Pop-XdrIngestDlq` drains every poll cycle. Sustained depth/age = DCE sustained issues, batches too large for retry, auth blocking replay, or DLQ regression. Auto-drain runs every Xdr-PollStream with TTL eviction. Severity Medium — backpressure = degraded ingest, not data loss (DLQ preserves). MITRE: TA0005 Defense Evasion — T1562. See KQL body + docs/RUNBOOK.md "DLQ backlog" for triage.
severity: Medium
enabled: false
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - AppMetrics
queryFrequency: 1h
queryPeriod: 4h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562
query: |
  // DLQ depth metric is emitted by Pop-XdrIngestDlq on each poll cycle.
  // AppMetrics schema: Sum/Min/Max/ItemCount (no `Value` column).
  // Metric names canonical: xdr.dlq.depth, xdr.dlq.pop_count.
  AppMetrics
  | where TimeGenerated > ago(4h)
  | where Name == "xdr.dlq.depth"
  | summarize MaxValue = max(Max) by Name, bin(TimeGenerated, 1h)
  | where MaxValue > 100
  | extend AlertReason = strcat("DLQ depth ", MaxValue, " > 100 entries")
  | project TimeGenerated, Name, MaxValue, AlertReason
entityMappings: []
eventGroupingSettings:
  aggregationKind: AlertPerResult
suppressionEnabled: true
suppressionDuration: PT2H
