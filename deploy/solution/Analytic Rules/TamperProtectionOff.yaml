id: d7b8f0a1-2c45-4d6f-e9a1-5b4c7f2d0e05
name: MDE Tamper Protection disabled
description: |
  Defender Tamper Protection disabled (`AdvancedFeatures.tamperProtection.Enabled` flipped to `false`). When ON, Tamper Protection prevents users (including admins via PowerShell/GPO) from disabling Defender, removing definitions, or modifying exclusions. Disabling = "anti-attacker" defense weakened; rarely justified outside narrow troubleshooting windows. Sustained `Enabled=false` = one of strongest "attacker prepared the ground" signals. Severity High — EDR's last-line defense; disabling rarely benign. MITRE: TA0005 Defense Evasion — T1562.001 (PRIMARY); T1562.012 cross-platform. See KQL body for triage path.
severity: High
enabled: false  # Sentinel Solution best practice — customer enables per-rule after reviewing query + threshold
requiredDataConnectors:
  - connectorId: XdrLogRaiderInternal
    dataTypes:
      - XdrConnectorHealth_CL
queryFrequency: 4h
queryPeriod: P2D
triggerOperator: gt
triggerThreshold: 0
tactics:
  - DefenseEvasion
relevantTechniques:
  - T1562.001
# Section R++++++.4 F4 fix (2026-05-07T15:00): MDE_AdvancedFeatures_CL is
# on Inventory tier (24h cadence in production). Old (15m freq / 2h
# period / parser 2h window) over-fired ~96x/day AND only saw 2/24 of
# polls — catastrophic mismatch. New: parser window 48h (2x cadence),
# queryPeriod P2D (48h) catches every cycle, queryFrequency 4h gives
# ~6 firings per cycle without storming.
query: |
  MDE_Drift_Inventory(48h, 4h) | where StreamName == "MDE_AdvancedFeatures_CL" | where EntityId has "Tamper" | where FieldName == "Enabled" and NewValue == "false"
entityMappings: []
eventGroupingSettings:
  aggregationKind: SingleAlert
suppressionEnabled: false
suppressionDuration: PT5H
